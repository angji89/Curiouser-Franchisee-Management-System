<style>
  :root {
    --cream:  #f7f2eb;
    --ochre:  #c98b2c;
    --slate1: #5c707a;
    --coral:  #bf5f49;
    --ink:    #3f4d51;
  }
  * { -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--cream); color: var(--ink); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  .font-display { font-family: 'Fraunces', serif; font-optical-sizing: auto; }

  /* —— IP PROTECTION for class plan viewer —— */
  .ip-protected {
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
    -webkit-touch-callout: none;
    pointer-events: auto;
  }
  .ip-protected img, .ip-protected video {
    pointer-events: none;
    -webkit-user-drag: none;
  }
  @media print {
    .ip-protected { display: none !important; }
    body::after {
      content: "Printing is disabled to protect curriculum IP.";
      display: block; font-size: 24px; padding: 40px; text-align: center;
    }
  }

  /* Watermark overlay */
  .watermark-layer {
    position: absolute; inset: 0; pointer-events: none;
    background-image: repeating-linear-gradient(
      -30deg,
      transparent 0, transparent 120px,
      rgba(63,77,81,0.04) 120px, rgba(63,77,81,0.04) 240px
    );
    z-index: 5;
  }
  .watermark-text {
    position: absolute; inset: 0; pointer-events: none;
    display: flex; flex-wrap: wrap; align-content: space-around; justify-content: space-around;
    overflow: hidden; z-index: 6;
  }
  .watermark-text span {
    font-family: 'Fraunces', serif;
    color: rgba(63,77,81,0.10);
    font-size: 14px; font-weight: 500;
    transform: rotate(-24deg);
    white-space: nowrap; padding: 40px;
  }

  /* Custom scrollbar */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(92,112,122,0.25); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(92,112,122,0.45); }

  /* Subtle paper texture */
  .paper {
    background-color: var(--cream);
    background-image:
      radial-gradient(rgba(201,139,44,0.04) 1px, transparent 1px),
      radial-gradient(rgba(92,112,122,0.04) 1px, transparent 1px);
    background-size: 24px 24px, 48px 48px;
    background-position: 0 0, 12px 12px;
  }

  /* Progress ring */
  .ring-bg { stroke: rgba(63,77,81,0.12); }
  .ring-fg { stroke: var(--ochre); transition: stroke-dashoffset 0.6s ease; }

  /* Checkbox custom */
  .sop-check {
    width: 28px; height: 28px; border-radius: 10px;
    border: 2px solid rgba(63,77,81,0.25);
    display: inline-flex; align-items: center; justify-content: center;
    transition: all 0.2s ease; flex-shrink: 0;
  }
  .sop-check.checked {
    background: var(--ochre); border-color: var(--ochre);
  }
  .sop-check.checked svg { opacity: 1; transform: scale(1); }
  .sop-check svg { opacity: 0; transform: scale(0.5); transition: all 0.2s ease; }

  /* Pill tabs */
  .pill { transition: all 0.2s ease; }
  .pill.active {
    background: var(--ink); color: var(--cream);
  }

  /* Nav item */
  .nav-item { transition: all 0.2s ease; }
  .nav-item.active {
    background: rgba(201,139,44,0.12);
    color: var(--ochre);
  }
  .nav-item.active .nav-dot { background: var(--ochre); }

  /* Fade in */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .animate-fade-up { animation: fadeUp 0.4s ease both; }

  /* Card hover */
  .card-hover { transition: all 0.25s ease; }
  .card-hover:hover { transform: translateY(-2px); box-shadow: 0 12px 28px -12px rgba(63,77,81,0.18); }

  /* Certificate */
  .certificate {
    background:
      radial-gradient(circle at 10% 10%, rgba(201,139,44,0.08), transparent 40%),
      radial-gradient(circle at 90% 90%, rgba(191,95,73,0.08), transparent 40%),
      #fffaf2;
    border: 1px solid rgba(201,139,44,0.3);
  }

  /* No text selection for viewer */
  .no-select, .no-select * {
    user-select: none !important;
    -webkit-user-select: none !important;
  }

  /* Video placeholder */
  .video-shell {
    background: linear-gradient(135deg, #3f4d51 0%, #5c707a 100%);
  }

  /* Toast */
  .toast {
    animation: fadeUp 0.3s ease, fadeOut 0.3s ease 2.4s forwards;
  }
  @keyframes fadeOut {
    to { opacity: 0; transform: translateY(-8px); }
  }

  /* Mobile adjustments */
  @media (max-width: 768px) {
    .desktop-only { display: none !important; }
  }
  @media (min-width: 769px) {
    .mobile-only { display: none !important; }
  }
</style>

function ClassPlanViewer({ selection, onBack }) {

  const [page, setPage] = useState(1);
  const totalPages = 4;

  // Anti-copy protections
  useEffect(() => {
    const handlers = {
      contextmenu: (e) => { e.preventDefault(); flashWarning('Right-click is disabled'); },
      keydown:     (e) => {
        // Block: Ctrl+S, Ctrl+P, Ctrl+C, Ctrl+A, PrtScn, F12, Ctrl+Shift+I, Ctrl+U
        if ((e.ctrlKey || e.metaKey) && ['s','p','c','a','u'].includes(e.key.toLowerCase())) {
          e.preventDefault(); flashWarning('This action is disabled to protect curriculum IP');
        }
        if (e.key === 'PrintScreen')  { flashWarning('Screenshots are discouraged — this is IP-protected content'); }
        if (e.key === 'F12')          { e.preventDefault(); flashWarning('Developer tools disabled'); }
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && ['i','j','c'].includes(e.key.toLowerCase())) {
          e.preventDefault(); flashWarning('Developer tools disabled');
        }
      },
      selectstart: (e) => e.preventDefault(),
      copy:        (e) => { e.preventDefault(); flashWarning('Copying is disabled'); },
      dragstart:   (e) => e.preventDefault(),
    };
    Object.entries(handlers).forEach(([k, fn]) => document.addEventListener(k, fn));
    return () => Object.entries(handlers).forEach(([k, fn]) => document.removeEventListener(k, fn));
  }, []);

  const [warning, setWarning] = useState(null);
  const flashWarning = (msg) => {
    setWarning(msg);
    setTimeout(() => setWarning(null), 2400);

function ProgressRing({ value, size = 60 }) {
  const r = size/2 - 4;
  const c = 2 * Math.PI * r;
  const offset = c - (value/100) * c;
  return (
    <svg width={size} height={size} className="shrink-0 -rotate-90">
      <circle cx={size/2} cy={size/2} r={r} className="ring-bg" fill="none" strokeWidth="6"/>
      <circle cx={size/2} cy={size/2} r={r} className="ring-fg" fill="none" strokeWidth="6" strokeLinecap="round"
        strokeDasharray={c} strokeDashoffset={offset}/>
      <text x={size/2} y={size/2 + 5} textAnchor="middle" className="rotate-90" fill="currentColor" fontSize="18" fontFamily="Fraunces" fontWeight="600" transform={`rotate(90 ${size/2} ${size/2})`}>{value}%</text>
    </svg>
  );
}

function QuizLesson({ lesson, onBack, showToast }) {
  const [answers, setAnswers] = useState({});
  const [submitted, setSubmitted] = useState(false);

  const score = Object.entries(answers).reduce((s, [qi, a]) => s + (QUIZ_QUESTIONS[qi].correct === a ? 1 : 0), 0);
  const total = QUIZ_QUESTIONS.length;
  const passed = score / total >= 0.7;

  return (
    <div className="animate-fade-up max-w-3xl mx-auto px-4 md:px-8 py-6 md:py-8">
      <button onClick={onBack} className="flex items-center gap-2 text-sm text-slate1 hover:text-ink mb-4">
        <Icon.chevL className="w-4 h-4"/> Back to course
      </button>

      <div className="text-xs text-ochre mb-1">{lesson.module?.title} · Quiz</div>
      <h1 className="font-display text-2xl md:text-3xl text-ink font-semibold mb-2">{lesson.title}</h1>
      <p className="text-slate1 text-sm mb-8">Answer all questions · 70% required to pass · {total} questions</p>

      <div className="space-y-6">
        {QUIZ_QUESTIONS.map((q, qi) => (
          <div key={q.id} className="bg-white/60 border border-ink/10 rounded-2xl p-5 md:p-6">
            <div className="flex items-start gap-3 mb-4">
              <div className="w-7 h-7 rounded-full bg-ochre/15 text-ochre flex items-center justify-center font-display font-semibold text-sm shrink-0">{qi+1}</div>
              <h3 className="font-display text-lg text-ink font-semibold leading-snug">{q.question}</h3>
            </div>
            <div className="space-y-2 ml-10">
              {q.options.map((opt, oi) => {
                const selected  = answers[qi] === oi;
                const isCorrect = submitted && oi === q.correct;
                const isWrong   = submitted && selected && oi !== q.correct;
                return (
                  <button key={oi} disabled={submitted}
                    onClick={() => setAnswers({...answers, [qi]: oi})}
                    className={`w-full text-left p-3 md:p-4 rounded-xl border transition text-sm flex items-center gap-3
                      ${isCorrect ? 'border-ochre bg-ochre/10' : ''}
                      ${isWrong   ? 'border-coral bg-coral/10' : ''}
                      ${!submitted && selected ? 'border-ink bg-ink/5' : ''}
                      ${!submitted && !selected ? 'border-ink/10 hover:border-ink/30' : ''}`}>
                    <div className={`w-5 h-5 rounded-full border-2 flex items-center justify-center shrink-0
                      ${isCorrect ? 'border-ochre bg-ochre' : ''}
                      ${isWrong   ? 'border-coral bg-coral' : ''}
                      ${!submitted && selected ? 'border-ink bg-ink' : ''}
                      ${!submitted && !selected ? 'border-ink/20' : ''}`}>
                      {(isCorrect || (!submitted && selected)) && <Icon.check className="w-3 h-3 text-cream" style={{strokeWidth: 4}}/>}
                      {isWrong && <Icon.x className="w-3 h-3 text-cream" style={{strokeWidth: 4}}/>}
                    </div>
                    <span className={isCorrect ? 'text-ochre font-medium' : isWrong ? 'text-coral' : 'text-ink'}>{opt}</span>
                  </button>
                );
              })}
            </div>
            {submitted && (
              <div className="ml-10 mt-3 p-3 rounded-xl bg-ink/5 text-sm text-slate1">
                <div className="font-medium text-ink mb-1">Explanation</div>
                {q.explanation}
              </div>
            )}
          </div>
        ))}
      </div>

      {!submitted ? (
        <button
          disabled={Object.keys(answers).length !== total}
          onClick={() => setSubmitted(true)}
          className="mt-8 w-full py-4 rounded-full bg-ochre text-cream font-medium disabled:opacity-40 disabled:cursor-not-allowed hover:bg-ochre/90 transition">
          Submit quiz
        </button>
      ) : (
        <div className={`mt-8 p-6 rounded-2xl ${passed ? 'bg-ochre/10 border border-ochre/30' : 'bg-coral/10 border border-coral/30'}`}>
          <div className="flex items-center gap-4 mb-3">
            <div className={`w-12 h-12 rounded-full flex items-center justify-center ${passed ? 'bg-ochre text-cream' : 'bg-coral text-cream'}`}>
              {passed ? <Icon.check className="w-6 h-6"/> : <Icon.x className="w-6 h-6"/>}
            </div>
            <div>
              <div className={`font-display text-xl font-semibold ${passed ? 'text-ochre' : 'text-coral'}`}>
                {passed ? 'You passed!' : 'Not quite there'}
              </div>
              <div className="text-sm text-slate1">You scored {score} / {total} ({Math.round(score/total*100)}%)</div>
            </div>
          </div>
          <div className="flex gap-3">
            {passed
              ? <button onClick={()=>{showToast('Progress saved'); onBack();}} className="px-5 py-2.5 rounded-full bg-ink text-cream text-sm font-medium">Continue to next lesson</button>
              : <button onClick={()=>{setSubmitted(false); setAnswers({});}} className="px-5 py-2.5 rounded-full bg-ink text-cream text-sm font-medium">Try again</button>}
            <button onClick={onBack} className="px-5 py-2.5 rounded-full border border-ink/20 text-ink text-sm font-medium">Back to course</button>
          </div>
        </div>
      )}
    </div>
  );
}

  const [completed, setCompleted] = useState({});
  const [photos,    setPhotos]    = useState({});
  const [notes,     setNotes]     = useState({});
  const [activeStep,setActiveStep]= useState(0);
  const [started,   setStarted]   = useState(false);
  const [startTime, setStartTime] = useState(null);

  const progress = Math.round(Object.keys(completed).length / sop.steps.length * 100);

  const toggleStep = (id) => {
    setCompleted(c => {
      const n = {...c};
      if (n[id]) delete n[id];
      else       n[id] = { at: new Date().toISOString() };
      return n;
    });
  };

  const addPhoto = (stepId) => {
    setPhotos(p => ({...p, [stepId]: [...(p[stepId]||[]), { id: Date.now(), name: 'IMG_' + Math.floor(Math.random()*9000 + 1000) + '.jpg' }] }));
    showToast('Photo uploaded');
  };

  const begin = () => {
    setStarted(true);
    setStartTime(new Date());
  };

  const finish = () => {
    const allDone     = Object.keys(completed).length === sop.steps.length;
    const photosNeeded = sop.steps.filter(s => s.requiresPhoto).every(s => photos[s.id]?.length);
    if (!allDone)      return showToast('Some steps are not yet complete');
    if (!photosNeeded) return showToast('Photo checkpoints missing');
    showToast('SOP execution logged successfully');
    setTimeout(onBack, 800);
  };

  if (!started) {
    return (
      <div className="animate-fade-up px-4 md:px-8 py-6 md:py-8 max-w-3xl mx-auto">

      <div className="px-4 md:px-8 py-6 max-w-3xl mx-auto">
        <div className="space-y-3">
          {sop.steps.map((step, i) => {
            const isCompleted = !!completed[step.id];
            const isActive    = activeStep === i;
            const stepPhotos  = photos[step.id] || [];
            const needsPhoto  = step.requiresPhoto && !stepPhotos.length;

            return (
              <div key={step.id}
                onClick={() => !isCompleted && setActiveStep(i)}
                className={`rounded-2xl border transition overflow-hidden
                  ${isCompleted ? 'bg-ochre/5 border-ochre/30' : isActive ? 'bg-white border-ink shadow-sm' : 'bg-white/60 border-ink/10 cursor-pointer hover:border-ink/30'}`}>
                <div className="p-4 md:p-5 flex items-start gap-3">
                  <button onClick={e => { e.stopPropagation(); toggleStep(step.id); }}
                    className={`sop-check ${isCompleted ? 'checked' : ''} mt-0.5`}>
                    <Icon.check className="w-4 h-4 text-cream" style={{strokeWidth: 4}}/>
                  </button>
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center justify-between gap-2 mb-1">
                      <div className="flex items-center gap-2">
                        <span className="text-xs text-slate1">Step {i+1}</span>
                        <span className="text-xs text-ochre">{step.time}</span>
                      </div>
                      {step.requiresPhoto && (
                        <span className={`text-xs flex items-center gap-1 px-2 py-0.5 rounded-full ${stepPhotos.length ? 'bg-ochre/15 text-ochre' : 'bg-coral/15 text-coral'}`}>
                          <Icon.camera className="w-3 h-3"/>
                          {stepPhotos.length ? 'Photo taken' : 'Photo needed'}
                        </span>
                      )}
                    </div>
                    <h3 className={`font-display text-lg font-semibold leading-tight ${isCompleted ? 'text-slate1 line-through' : 'text-ink'}`}>{step.title}</h3>
                    {(isActive || isCompleted) && (
                      <>
                        <p className="text-sm text-slate1 mt-2 leading-relaxed">{step.desc}</p>

                        {/* Photo section */}
                        {step.requiresPhoto && (
                          <div className="mt-4">
                            <div className="text-xs text-slate1 mb-2">{step.photoPrompt}</div>
                            <div className="flex flex-wrap gap-2">
                              {stepPhotos.map(p => (
                                <div key={p.id} className="w-20 h-20 rounded-lg bg-gradient-to-br from-slate1 to-ink flex items-center justify-center relative">
                                  <Icon.image className="w-6 h-6 text-cream/60"/>
                                  <div className="absolute inset-x-0 bottom-0 bg-ink/70 text-cream text-[9px] px-1 py-0.5 truncate">{p.name}</div>
                                </div>
                              ))}
                              <button onClick={e => { e.stopPropagation(); addPhoto(step.id); }}
                                className="w-20 h-20 rounded-lg border-2 border-dashed border-ink/20 hover:border-ochre text-slate1 hover:text-ochre transition flex flex-col items-center justify-center gap-1">
                                <Icon.camera className="w-5 h-5"/>
                                <span className="text-[10px]">Add</span>
                              </button>
                            </div>
                          </div>
                        )}

                        {/* Notes */}
                        {isActive && !isCompleted && (
                          <div className="mt-4">
                            <textarea
                              value={notes[step.id] || ''}
                              onChange={e => setNotes({...notes, [step.id]: e.target.value})}
                              placeholder="Optional notes (e.g., adjustments, observations)..."
                              rows="2"
                              className="w-full p-3 text-sm bg-cream/50 border border-ink/10 rounded-lg focus:outline-none focus:border-ochre resize-none"
                            />
                          </div>
                        )}
                      </>
                    )}
                  </div>
                </div>
              </div>
            );
          })}
        </div>

        {/* Finish bar */}
        <div className="mt-8 p-5 rounded-2xl bg-ink text-cream flex items-center justify-between flex-wrap gap-3">
          <div>
            <div className="text-xs uppercase tracking-widest text-cream/60 mb-0.5">Execution summary</div>
            <div className="font-display text-lg font-semibold">{Object.keys(completed).length} of {sop.steps.length} steps · {Object.values(photos).flat().length} photos</div>
          </div>
          <button onClick={finish} disabled={Object.keys(completed).length === 0}
            className="px-6 py-3 rounded-full bg-ochre text-cream text-sm font-medium disabled:opacity-40 hover:bg-ochre/90 transition flex items-center gap-2">
            <Icon.check className="w-4 h-4"/> Submit execution log
          </button>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════════

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
