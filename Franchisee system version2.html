// ═══════ UTILITIES ═══════
function Toast({ message, onDone }) {
  useEffect(() => { const t = setTimeout(onDone, 2700); return () => clearTimeout(t); }, []);
  return <div className="toast fixed bottom-20 lg:bottom-6 left-1/2 -translate-x-1/2 z-50 bg-ink2 text-canvas px-4 py-2.5 rounded-xl shadow-lg flex items-center gap-2.5 text-[13px]"><I.check className="w-3.5 h-3.5"/><span>{message}</span></div>;
}
function ProgressBar({ value, height = 3 }) { return <div className="progress-track rounded-full overflow-hidden" style={{height:`${height}px`}}><div className="progress-fill h-full rounded-full" style={{width:`${value}%`}}/></div>; }
function Pill({ children, tone = 'neutral' }) {
  const tones = { neutral:'bg-cream text-muted border border-line', dark:'bg-ink2 text-canvas', ochre:'bg-ochre/10 text-ochre border border-ochre/20', success:'bg-success/10 text-success border border-success/20', warning:'bg-warning/10 text-warning border border-warning/20', danger:'bg-danger/10 text-danger border border-danger/20', outline:'border border-line2 text-ink2 bg-canvas' };
  return <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium ${tones[tone]}`}>{children}</span>;
}
function healthColor(s) { return s >= 85 ? 'green' : s >= 70 ? 'yellow' : 'red'; }
function healthLabel(s) { return s >= 85 ? 'Excellent' : s >= 70 ? 'Good' : s >= 55 ? 'Needs attention' : 'Critical'; }
function healthHex(s) { return s >= 85 ? '#6b8e7b' : s >= 70 ? '#c98b2c' : '#bf5f49'; }

}

function MetricCell({ value, threshold, suffix }) {
  const color = value >= threshold.good ? 'text-success' : value >= threshold.ok ? 'text-ochre' : 'text-coral';
  return <td className="px-3 py-4 text-right tabular-nums"><div className={`${color} font-medium`}>{value}{suffix}</div></td>;
}

function KPICard({ icon: Icon, eyebrow, value, change, trend, spark }) {
  const trendColor = trend === 'up' ? 'text-success' : trend === 'down' ? 'text-coral' : 'text-muted';
  const TrendIcon = trend === 'up' ? I.trend : trend === 'down' ? I.trendD : null;
  return (
    <div className="card rounded-2xl p-5 lg:p-6">
      <div className="flex items-center justify-between mb-5">
        <div className="w-9 h-9 rounded-lg bg-cream hairline border flex items-center justify-center">
          <Icon className="w-4 h-4 text-ink2"/>
        </div>
        {spark && <Sparkline data={spark} width={72} height={28}/>}
      </div>
      <div className="tracked text-muted2 mb-1.5">{eyebrow}</div>
      <div className="display-sans text-[28px] lg:text-[32px] text-ink2 tabular-nums mb-1">{value}</div>
      <div className={`text-[11.5px] font-medium inline-flex items-center gap-0.5 ${trendColor}`}>
        {TrendIcon && <TrendIcon className="w-3 h-3"/>}{change}
      </div>
    </div>
  );
}

function Sparkline({ data, width = 80, height = 30, color }) {
  const max = Math.max(...data), min = Math.min(...data);
  const range = max - min || 1;
  const points = data.map((v, i) => {
    const x = (i / (data.length - 1)) * width;
    const y = height - ((v - min) / range) * (height - 4) - 2;
    return `${x},${y}`;
  }).join(' ');
  return <svg width={width} height={height} className="overflow-visible"><polyline points={points} className="sparkline" style={{stroke:color||'var(--ink2)'}}/></svg>;
}

function RevenueChart({ data }) {
  const months = ['May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar','Apr'];
  const max = Math.max(...data);
  const target = 130;
  const width = 100;
  const height = 200;
  return (
    <div className="relative">
      <svg viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none" className="w-full h-[200px]">
        <line x1="0" y1={height - (target/max)*height*0.85} x2={width} y2={height - (target/max)*height*0.85} stroke="var(--ochre)" strokeWidth="0.25" strokeDasharray="1,1" opacity="0.6"/>
        <polygon points={`0,${height} ${data.map((v,i)=>`${(i/(data.length-1))*width},${height-(v/max)*height*0.85}`).join(' ')} ${width},${height}`} fill="url(#revgrad)" opacity="0.3"/>
        <polyline points={data.map((v,i)=>`${(i/(data.length-1))*width},${height-(v/max)*height*0.85}`).join(' ')} fill="none" stroke="var(--ink2)" strokeWidth="0.5" strokeLinecap="round" strokeLinejoin="round" vectorEffect="non-scaling-stroke"/>
        <defs><linearGradient id="revgrad" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stopColor="var(--ink2)" stopOpacity="0.4"/><stop offset="100%" stopColor="var(--ink2)" stopOpacity="0"/></linearGradient></defs>
        {data.map((v,i)=><circle key={i} cx={(i/(data.length-1))*width} cy={height-(v/max)*height*0.85} r="0.4" fill="var(--ink2)" vectorEffect="non-scaling-stroke"/>)}
      </svg>
      <div className="flex justify-between text-[10.5px] text-muted2 mt-3 px-1">
        {months.map((m, i) => <span key={i} className={i === months.length-1 ? 'text-ink2 font-medium' : ''}>{m}</span>)}
      </div>
    </div>
  );
}

function HealthRing({ value, size }) {
  const strokeWidth = 8;
  const r = size/2 - strokeWidth;
  const c = 2 * Math.PI * r;
  const offset = c - (value/100) * c;
  const color = healthHex(value);
  return (
    <svg width={size} height={size} className="-rotate-90 shrink-0">
      <circle cx={size/2} cy={size/2} r={r} fill="none" strokeWidth={strokeWidth} stroke="var(--line)"/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" strokeWidth={strokeWidth} strokeLinecap="round" stroke={color} strokeDasharray={c} strokeDashoffset={offset} className="score-ring"/>
      <text x={size/2} y={size/2 - 2} textAnchor="middle" transform={`rotate(90 ${size/2} ${size/2})`} fill="var(--ink2)" fontSize={size*0.22} fontWeight="500" fontFamily="Inter" className="tabular-nums">{value}</text>
      <text x={size/2} y={size/2 + 14} textAnchor="middle" transform={`rotate(90 ${size/2} ${size/2})`} fill="var(--muted)" fontSize="10" fontFamily="Inter" style={{letterSpacing:'0.1em',textTransform:'uppercase'}}>avg health</text>
    </svg>
  );
}

function BarChart({ data, max }) {
  const actualMax = max || Math.max(...data.map(d => d.value));
  return (
    <div className="space-y-2.5">
      {data.map(d => (
        <div key={d.label} className="flex items-center gap-3 text-[12px]">
          <div className="w-32 truncate text-ink2">{d.label}</div>
          <div className="flex-1 h-6 bg-cream rounded-md overflow-hidden hairline border relative">
            <div className="h-full rounded-md transition-all duration-500" style={{ width:`${(d.value / actualMax) * 100}%`, background:d.color || 'var(--ink2)' }}/>
          </div>
          <div className="w-10 text-right text-ink2 font-medium tabular-nums">{d.value}</div>
        </div>
      ))}
    </div>
  );
}

function ProgressRing({ value, size = 60, dark = false }) {
  const r = size/2 - 3;
  const c = 2 * Math.PI * r;
  const offset = c - (value/100) * c;
  return (
    <svg width={size} height={size} className="-rotate-90 shrink-0">
      <circle cx={size/2} cy={size/2} r={r} fill="none" strokeWidth="2.5" stroke={dark ? 'rgba(253,251,246,0.15)' : 'var(--line)'}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" strokeWidth="2.5" strokeLinecap="round" stroke={dark ? 'rgba(253,251,246,0.9)' : 'var(--ink2)'} strokeDasharray={c} strokeDashoffset={offset} className="score-ring"/>
      <text x={size/2} y={size/2+4} textAnchor="middle" transform={`rotate(90 ${size/2} ${size/2})`} fill={dark ? 'var(--canvas)' : 'var(--ink2)'} fontSize="14" fontWeight="500" fontFamily="Inter" className="tabular-nums">{value}%</text>
    </svg>
  );
}

function VideoLesson({ lesson, onBack, showToast }) {
  const [playing, setPlaying] = useState(false);
  const [progress, setProgress] = useState(32);
  useEffect(() => {
    if (!playing) return;
    const i = setInterval(()=>setProgress(p=>Math.min(100, p+1.5)), 500);
    return () => clearInterval(i);
  }, [playing]);

  return (
    <div className="max-w-[900px] mx-auto px-6 lg:px-10 py-8 lg:py-12 animate-fade-up">
      <BreadcrumbBack onClick={onBack} label="Back to course"/>

          <button onClick={()=>setPlaying(!playing)} className="w-14 h-14 lg:w-16 lg:h-16 rounded-full bg-canvas/95 text-ink2 flex items-center justify-center hover:scale-105 transition shadow-lg relative z-10">
            {playing ? <svg viewBox="0 0 24 24" className="w-5 h-5" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg> : <I.play className="w-5 h-5 ml-0.5"/>}

          </div>
          <div className="flex items-center justify-between text-canvas/80 text-[11px] mt-2 tabular-nums">

function QuizLesson({ lesson, onBack, showToast }) {
  const [answers, setAnswers] = useState({});
  const [submitted, setSubmitted] = useState(false);
  const score = Object.entries(answers).reduce((s, [qi, a]) => s + (QUIZ_QUESTIONS[qi].correct === a ? 1 : 0), 0);
  const total = QUIZ_QUESTIONS.length;
  const passed = score / total >= 0.7;

  return (
    <div className="max-w-[720px] mx-auto px-6 lg:px-10 py-8 lg:py-12 animate-fade-up">
      <BreadcrumbBack onClick={onBack} label="Back to course"/>
      <div className="tracked text-muted2 mb-2">{lesson.module?.title} · Quiz</div>
      <h1 className="display-serif text-[32px] lg:text-[44px] text-ink2 mb-3 leading-[1.04]">{lesson.title}</h1>
      <p className="text-[13px] text-muted mb-10">Answer all questions · 70% required to pass · {total} questions</p>

      <div className="space-y-4">
        {QUIZ_QUESTIONS.map((q, qi) => (
          <div key={q.id} className="card rounded-2xl p-6">
            <div className="flex items-start gap-5 mb-5">
              <div className="display-serif-italic text-[20px] text-muted2 tabular-nums shrink-0">{String(qi+1).padStart(2,'0')}</div>
              <h3 className="text-[17px] font-medium text-ink2 leading-snug flex-1">{q.question}</h3>
            </div>
            <div className="space-y-2 ml-11">
              {q.options.map((opt, oi) => {
                const selected = answers[qi] === oi;
                const isCorrect = submitted && oi === q.correct;
                const isWrong = submitted && selected && oi !== q.correct;
                return (
                  <button key={oi} disabled={submitted} onClick={()=>setAnswers({...answers,[qi]:oi})}
                    className={`w-full text-left p-3.5 rounded-xl border transition text-[14px] flex items-center gap-3
                      ${isCorrect ? 'border-success bg-success/5 text-success' : ''}
                      ${isWrong   ? 'border-danger bg-danger/5 text-danger' : ''}
                      ${!submitted && selected ? 'border-ink2 bg-cream text-ink2' : ''}
                      ${!submitted && !selected ? 'border-line hover:border-line2 text-ink2' : ''}`}>
                    <div className={`w-4 h-4 rounded-full border-[1.5px] flex items-center justify-center shrink-0
                      ${isCorrect ? 'border-success bg-success' : ''}
                      ${isWrong   ? 'border-danger bg-danger' : ''}
                      ${!submitted && selected ? 'border-ink2 bg-ink2' : ''}
                      ${!submitted && !selected ? 'border-line2' : ''}`}>
                      {(isCorrect || (!submitted && selected)) && <I.check className="w-2.5 h-2.5 text-canvas" style={{strokeWidth:3}}/>}
                      {isWrong && <I.x className="w-2.5 h-2.5 text-canvas" style={{strokeWidth:3}}/>}
                    </div>
                    <span>{opt}</span>
                  </button>
                );
              })}
            </div>
            {submitted && <div className="ml-11 mt-3 p-3 rounded-xl card-sunken text-[13px] text-ink"><div className="font-medium text-ink2 mb-1">Explanation</div>{q.explanation}</div>}
          </div>
        ))}
      </div>

      {!submitted ? (
        <button disabled={Object.keys(answers).length !== total} onClick={()=>setSubmitted(true)} className="btn-primary mt-8 w-full py-3.5 rounded-full text-[13px] disabled:opacity-30 disabled:cursor-not-allowed">
          Submit quiz
        </button>
      ) : (
        <div className="mt-8 card rounded-2xl p-6">
          <div className="flex items-center gap-4 mb-4">
            <div className={`w-10 h-10 rounded-full flex items-center justify-center ${passed ? 'bg-success text-canvas' : 'bg-danger text-canvas'}`}>
              {passed ? <I.check className="w-5 h-5"/> : <I.x className="w-5 h-5"/>}
            </div>
            <div>
              <div className="text-[17px] font-medium text-ink2">{passed ? 'You passed' : 'Not quite there'}</div>
              <div className="text-[13px] text-muted tabular-nums">Score: {score} / {total} ({Math.round(score/total*100)}%)</div>
            </div>
          </div>
          <div className="flex gap-3">
            {passed
              ? <button onClick={()=>{showToast('Progress saved'); onBack();}} className="btn-primary px-5 py-2 rounded-full text-[13px]">Continue</button>
              : <button onClick={()=>{setSubmitted(false); setAnswers({});}} className="btn-primary px-5 py-2 rounded-full text-[13px]">Try again</button>}
            <button onClick={onBack} className="btn-ghost px-5 py-2 rounded-full text-[13px]">Back to course</button>
          </div>
        </div>
      )}
    </div>
  );
}

function SOPRunner({ sop, onBack, showToast }) {
  const [completed, setCompleted] = useState({});
  const [photos, setPhotos] = useState({});
  const [activeStep, setActiveStep] = useState(0);
  const [started, setStarted] = useState(false);

  const progress = Math.round(Object.keys(completed).length / sop.steps.length * 100);

  const toggleStep = (id) => setCompleted(c => { const n={...c}; if(n[id]) delete n[id]; else n[id]={at:new Date().toISOString()}; return n; });
  const addPhoto = (stepId) => { setPhotos(p => ({...p,[stepId]:[...(p[stepId]||[]),{id:Date.now(),name:'IMG_'+Math.floor(Math.random()*9000+1000)+'.jpg'}]})); showToast('Photo uploaded'); };

  const finish = () => {
    const allDone = Object.keys(completed).length === sop.steps.length;
    const photosOk = sop.steps.filter(s=>s.requiresPhoto).every(s=>photos[s.id]?.length);
    if (!allDone) return showToast('Some steps are incomplete');
    if (!photosOk) return showToast('Photo checkpoints missing');
    showToast('Execution logged');
    setTimeout(onBack, 700);
  };

  if (!started) {
    return (
      <div className="max-w-[720px] mx-auto px-6 lg:px-10 py-8 lg:py-12 animate-fade-up">
        <BreadcrumbBack onClick={onBack} label="All SOPs"/>
        <div className="card rounded-2xl p-8">
          <div className="tracked text-muted2 mb-3">{sop.linkedClass}</div>
          <h1 className="display-serif text-[32px] lg:text-[44px] text-ink2 mb-5 leading-[1.04]">{sop.title}</h1>
          <div className="flex items-center gap-3 text-[13px] text-muted mb-8 flex-wrap">
            <span className="inline-flex items-center gap-1.5"><I.clock className="w-3.5 h-3.5"/>{sop.duration}</span>
            <span className="text-muted2">·</span>
            <span>{sop.steps.length} steps</span>
            <span className="text-muted2">·</span>
            <span>{sop.steps.filter(s=>s.requiresPhoto).length} photo checkpoints</span>
          </div>

          <div className="tracked text-muted2 mb-3">Materials to prepare</div>
          <div className="grid sm:grid-cols-2 gap-2 mb-8">
            {sop.materials.map(m => (
              <div key={m} className="flex items-center gap-2.5 p-2.5 rounded-lg card-sunken text-[13px] text-ink">
                <div className="check-box checked"><I.check className="w-3 h-3 text-canvas"/></div>
                <span>{m}</span>
              </div>
            ))}
          </div>

          <button onClick={()=>setStarted(true)} className="btn-primary w-full py-3 rounded-full text-[13px] flex items-center justify-center gap-2">
            <I.play className="w-3 h-3"/> Start execution
          </button>
        </div>
      </div>
    );
  }

  const current = sop.steps[activeStep];
  const stepPhotos = photos[current.id] || [];

  return (
    <div className="max-w-[900px] mx-auto px-6 lg:px-10 py-8 lg:py-12 animate-fade-up">
      <div className="flex items-center justify-between mb-6">
        <button onClick={()=>setStarted(false)} className="flex items-center gap-1.5 text-[13px] text-muted hover:text-ink2 transition"><I.chevL className="w-4 h-4"/><span>Exit</span></button>
        <div className="text-[12px] text-muted tabular-nums">{Object.keys(completed).length} / {sop.steps.length} complete</div>
      </div>

      <div className="mb-8">
        <ProgressBar value={progress} height={4}/>
      </div>

      <div className="tracked text-muted mb-3">{sop.title}</div>

      <div className="card rounded-2xl p-6 lg:p-8 mb-6">
        <div className="flex items-start gap-4 mb-6">
          <div className="display-serif-italic text-[28px] text-ochre tabular-nums shrink-0">{String(activeStep+1).padStart(2,'0')}</div>
          <div className="flex-1">
            <h2 className="display-serif text-[28px] lg:text-[32px] text-ink2 mb-2 leading-[1.1]">{current.title}</h2>
            <div className="text-[13px] text-muted">{current.time}</div>
          </div>
          <button onClick={()=>toggleStep(current.id)} className={`check-box ${completed[current.id] ? 'checked' : ''} w-8 h-8`}>
            <I.check className="w-4 h-4 text-canvas"/>
          </button>
        </div>

        <p className="text-[15.5px] text-ink leading-relaxed mb-6">{current.desc}</p>

        {current.requiresPhoto && (
          <div className="card-sunken rounded-xl p-5">
            <div className="flex items-center gap-2 mb-4">
              <I.camera className="w-4 h-4 text-ink2"/>
              <div className="text-[13px] font-medium text-ink2">Photo checkpoint</div>
              <Pill tone="ochre">Required</Pill>
            </div>
            <p className="text-[13px] text-muted mb-4">{current.photoPrompt}</p>
            {stepPhotos.length > 0 && (
              <div className="grid grid-cols-3 gap-2 mb-3">
                {stepPhotos.map(p => (
                  <div key={p.id} className="thumb aspect-square rounded-lg flex items-center justify-center relative">
                    <I.image className="w-5 h-5 text-white relative z-10"/>
                  </div>
                ))}
              </div>
            )}
            <button onClick={()=>addPhoto(current.id)} className="btn-ghost w-full py-2 rounded-xl text-[12.5px] flex items-center justify-center gap-2">
              <I.camera className="w-3.5 h-3.5"/> Upload photo
            </button>
          </div>
        )}
      </div>

      <div className="flex items-center gap-3">
        <button onClick={()=>setActiveStep(Math.max(0,activeStep-1))} disabled={activeStep===0} className="btn-ghost px-5 py-2.5 rounded-full text-[13px] disabled:opacity-30">Previous</button>
        {activeStep < sop.steps.length - 1 ? (
          <button onClick={()=>setActiveStep(activeStep+1)} className="btn-primary flex-1 py-2.5 rounded-full text-[13px]">Next step →</button>
        ) : (
          <button onClick={finish} className="btn-primary flex-1 py-2.5 rounded-full text-[13px] inline-flex items-center justify-center gap-2"><I.check className="w-3.5 h-3.5"/> Finish execution</button>
        )}
      </div>

      <div className="mt-10">
        <div className="tracked text-muted mb-3">All steps</div>
        <div className="space-y-1.5">
          {sop.steps.map((s, i) => (
            <button key={s.id} onClick={()=>setActiveStep(i)} className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-left transition ${activeStep === i ? 'bg-cream border hairline' : 'hover:bg-cream/50'}`}>
              <div className={`w-5 h-5 rounded-full flex items-center justify-center shrink-0 ${completed[s.id] ? 'bg-ink2' : 'border-[1.5px] border-line2 bg-canvas'}`}>
                {completed[s.id] && <I.check className="w-3 h-3 text-canvas"/>}
              </div>
              <div className="display-serif-italic text-[13px] text-muted2 tabular-nums w-5 shrink-0">{String(i+1).padStart(2,'0')}</div>
              <div className="flex-1 min-w-0 text-[13px] text-ink2 truncate">{s.title}</div>
              <div className="text-[11px] text-muted tabular-nums shrink-0">{s.time}</div>
            </button>
          ))}
        </div>
      </div>
    </div>
  );
}

      </div>

      {showAdd && (
        <div className="card rounded-2xl p-6 mb-6 animate-fade-up">
          <div className="flex items-center justify-between mb-5">
            <h3 className="text-[16px] font-medium text-ink2">New observation</h3>
            <button onClick={()=>setShowAdd(false)}><I.x className="w-4 h-4 text-muted"/></button>
          </div>
          <textarea value={note} onChange={e=>setNote(e.target.value)} rows="4" placeholder="What did you observe?" className="input w-full p-3 rounded-xl text-[14px] resize-none mb-4"/>
          <div className="tracked text-muted2 mb-3">EYFS areas (select one or more)</div>
          <div className="flex flex-wrap gap-2 mb-5">
            {EYFS_AREAS.map(a => (
              <button key={a.id} onClick={()=>toggleArea(a.id)} className={`px-3 py-1.5 rounded-full text-[12px] font-medium transition ${selectedAreas.includes(a.id) ? 'bg-ink2 text-canvas' : 'bg-cream text-muted hover:text-ink2 border hairline'}`}>
                {a.name}
              </button>
            ))}
          </div>
          <div className="flex gap-2">
            <button onClick={submitObs} disabled={!note.trim() || !selectedAreas.length} className="btn-primary px-5 py-2 rounded-full text-[13px] disabled:opacity-40">Save observation</button>
            <button onClick={()=>setShowAdd(false)} className="btn-ghost px-5 py-2 rounded-full text-[13px]">Cancel</button>
          </div>
        </div>
      )}

      <div className="tracked text-muted mb-4 detail-line">Recent observations</div>
      <div className="space-y-4 stagger">
        {observations.map(o => (
          <div key={o.id} className="card rounded-2xl p-6">
            <div className="flex items-center justify-between mb-3">
              <div className="flex flex-wrap gap-1.5">
                {o.areas.map(aid => {
                  const area = EYFS_AREAS.find(a => a.id === aid);
                  return <Pill key={aid} tone="neutral">{area?.short}</Pill>;
                })}
              </div>
              <div className="text-[11px] text-muted tabular-nums">{o.date}</div>
            </div>
            <p className="text-[14.5px] text-ink leading-relaxed">{o.note}</p>
          </div>
        ))}
      </div>
    </div>
  );
}

// ═══════ ADMIN ═══════
function AdminPanel({ view, setView, showToast }) {
  return (
    <div className="max-w-[1280px] mx-auto px-6 lg:px-10 py-10 lg:py-14 animate-fade-up">
      <PageHeader
        eyebrow="Administration"
        title={<>Admin <em className="display-serif-italic text-muted">panel</em></>}
        subtitle="Manage users, stores and permissions across the franchise network."
      />

      <div className="flex items-center gap-2 mb-6 overflow-x-auto">
        {[
          { id:'users',  label:'Users',  icon:I.users  },
          { id:'stores', label:'Stores', icon:I.store  },
        ].map(v => (
          <button key={v.id} onClick={()=>setView(v.id)} className={`pill px-3.5 py-1.5 rounded-full text-[13px] font-medium whitespace-nowrap inline-flex items-center gap-1.5 ${view===v.id ? 'active' : ''}`}>
            <v.icon className="w-3.5 h-3.5"/>{v.label}
          </button>
        ))}
      </div>

      {view === 'users' && (
        <div className="card rounded-2xl overflow-hidden">
          <div className="flex items-center justify-between p-5 lg:p-6 hairline-b">
            <div>
              <h3 className="text-[16px] font-medium text-ink2">Users</h3>
              <div className="text-[12px] text-muted">{MOCK_USERS.length} across all stores</div>
            </div>
            <button onClick={()=>showToast('Invite sent')} className="btn-primary px-3 py-1.5 rounded-full text-[12px] inline-flex items-center gap-1.5"><I.plus className="w-3 h-3"/> Invite</button>
          </div>
          <div className="overflow-x-auto">
            <table className="w-full text-[13px] min-w-[700px]">
              <thead>
                <tr className="tracked text-muted2 bg-cream/60 hairline-b">
                  <th className="text-left font-medium px-5 lg:px-6 py-3">Name</th>
                  <th className="text-left font-medium px-3 py-3">Role</th>
                  <th className="text-left font-medium px-3 py-3">Store</th>
                  <th className="text-left font-medium px-3 py-3">Status</th>
                  <th className="text-right font-medium px-5 lg:px-6 py-3"></th>
                </tr>
              </thead>
              <tbody>
                {MOCK_USERS.map((u, i) => (
                  <tr key={u.id} className={`${i !== MOCK_USERS.length-1 ? 'hairline-b' : ''} hover:bg-cream/40 transition`}>
                    <td className="px-5 lg:px-6 py-3.5">
                      <div className="flex items-center gap-3">
                        <div className="w-8 h-8 rounded-full bg-cream hairline border flex items-center justify-center shrink-0">
                          <span className="display-serif-italic text-[13px] text-ink2">{u.name.split(' ').map(n=>n[0]).join('')}</span>
                        </div>
                        <div>
                          <div className="font-medium text-ink2">{u.name}</div>
                          <div className="text-[11px] text-muted">{u.email}</div>
                        </div>
                      </div>
                    </td>
                    <td className="px-3 py-3.5"><Pill tone={u.role === 'HQ_ADMIN' ? 'ochre' : u.role === 'FRANCHISEE_ADMIN' ? 'dark' : 'neutral'}>{u.role.replace('_',' ').toLowerCase()}</Pill></td>
                    <td className="px-3 py-3.5 text-ink2">{u.store}</td>
                    <td className="px-3 py-3.5">{u.active ? <Pill tone="success">Active</Pill> : <Pill tone="neutral">Inactive</Pill>}</td>
                    <td className="px-5 lg:px-6 py-3.5 text-right">
                      <button className="p-1 hover:bg-cream rounded-md transition"><I.edit className="w-3.5 h-3.5 text-muted2"/></button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {view === 'stores' && (
        <div className="grid md:grid-cols-2 gap-4 stagger">
          {MOCK_STORES.map(s => (
            <div key={s.id} className="card rounded-2xl p-6">
              <div className="flex items-start justify-between mb-5">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-xl bg-cream hairline border flex items-center justify-center">
                    <I.store className="w-[17px] h-[17px] text-ink2"/>
                  </div>
                  <div>
                    <h3 className="text-[16px] font-medium text-ink2" style={{letterSpacing:'-0.02em'}}>{s.name}</h3>
                    <div className="text-[11px] text-muted tabular-nums">{s.code} · {s.region}</div>
                  </div>
                </div>
                <Pill tone={s.healthScore >= 85 ? 'success' : s.healthScore >= 70 ? 'ochre' : 'danger'}>{s.healthScore}</Pill>
              </div>
              <div className="grid grid-cols-2 gap-4 pt-4 hairline-t">
                <div>
                  <div className="tracked text-muted2 mb-1">Teachers</div>
                  <div className="display-sans text-[22px] text-ink2 tabular-nums">{s.teachers}</div>
                </div>
                <div>
                  <div className="tracked text-muted2 mb-1">Students</div>
                  <div className="display-sans text-[22px] text-ink2 tabular-nums">{s.students}</div>
                </div>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ═══════ BOOT ═══════
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
