<style>
  :root {
    --paper: #f7f2eb;
    --cream: #faf6ef;
    --canvas: #fdfbf6;
    --line: #e6ddd0;
    --line2: #d4c8b5;
    --ink: #3f4d51;
    --ink2: #2a3538;
    --muted: #7a7066;
    --muted2: #a89f92;
    --ochre: #c98b2c;
    --coral: #bf5f49;
    --slate: #5c707a;
  }
  * {
    -webkit-tap-highlight-color: transparent;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  html, body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    font-feature-settings: "cv02","cv03","cv04","cv11","ss01";
    letter-spacing: -0.01em;
  }

  /* Subtle paper grain — almost imperceptible warmth */
  body::before {
    content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85'/%3E%3CfeColorMatrix values='0 0 0 0 0.78 0 0 0 0 0.72 0 0 0 0 0.62 0 0 0 0.04 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity: 0.6;
  }
  #root { position: relative; z-index: 1; }

  /* Typography — editorial discipline */
  .display-tight { letter-spacing: -0.035em; line-height: 1.04; }
  .display-xl    { letter-spacing: -0.04em; line-height: 1.01; }
  .tracked       { letter-spacing: 0.16em; text-transform: uppercase; font-size: 10.5px; font-weight: 500; }

  /* Instrument Serif — our secret weapon */
  .serif {
    font-family: 'Instrument Serif', Georgia, serif;
    font-weight: 400;
    letter-spacing: -0.015em;
  }
  .serif-italic {
    font-family: 'Instrument Serif', Georgia, serif;
    font-style: italic;
    font-weight: 400;
    letter-spacing: -0.01em;
  }

  /* IP Protection */
  .ip-protected { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  .ip-protected img, .ip-protected video { pointer-events: none; -webkit-user-drag: none; }
  @media print { .ip-protected { display: none !important; } }
  .watermark-tile {
    position: absolute; inset: 0; pointer-events: none;
    display: flex; flex-wrap: wrap; align-content: space-around; justify-content: space-around;
    overflow: hidden; z-index: 5;
  }
  .watermark-tile span {
    color: rgba(63,77,81,0.055);
    font-size: 10.5px; font-weight: 400;
    transform: rotate(-24deg);
    white-space: nowrap; padding: 28px;
    letter-spacing: 0.1em; text-transform: uppercase;
  }

  /* Warm scrollbar */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(63,77,81,0.14); border-radius: 8px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(63,77,81,0.28); }

  /* Buttons — refined & tactile */
  .btn-primary {
    background: var(--ink2);
    color: var(--canvas);
    font-weight: 450;
    transition: all 180ms cubic-bezier(0.22, 0.61, 0.36, 1);
    letter-spacing: -0.005em;
  }
  .btn-primary:hover { background: #1a2427; transform: translateY(-0.5px); box-shadow: 0 2px 8px rgba(42,53,56,0.12); }
  .btn-primary:active { transform: translateY(0); }
  .btn-ochre {
    background: var(--ochre);
    color: var(--canvas);
    font-weight: 450;
    transition: all 180ms cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  .btn-ochre:hover { background: var(--ochre2); }
  .btn-ghost {
    color: var(--ink);
    background: transparent;
    border: 1px solid var(--line2);
    transition: all 180ms cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  .btn-ghost:hover { background: var(--cream); border-color: var(--muted2); }

  /* Cards — warm, quiet */
  .card {
    background: var(--canvas);
    border: 1px solid var(--line);
    transition: all 240ms cubic-bezier(0.22, 0.61, 0.36, 1);
  }
  .card-hover:hover {
    border-color: var(--line2);
    transform: translateY(-1px);
    box-shadow: 0 1px 2px rgba(63,77,81,0.03), 0 8px 24px rgba(63,77,81,0.06);
  }
  .card-sunken {
    background: var(--cream);
    border: 1px solid var(--line);
  }

  /* Progress bar — thin and quiet */
  .progress-track { background: var(--line); }
  .progress-fill  { background: var(--ink2); transition: width 500ms cubic-bezier(0.22, 0.61, 0.36, 1); }

  /* Hairline divider */
  .hairline { border-color: var(--line); }
  .hairline-b { border-bottom: 1px solid var(--line); }
  .hairline-t { border-top: 1px solid var(--line); }

  /* Fade animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .animate-fade-up { animation: fadeUp 420ms cubic-bezier(0.22, 0.61, 0.36, 1) both; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .animate-fade { animation: fadeIn 300ms ease-out both; }

  .stagger > * { opacity: 0; animation: fadeUp 480ms cubic-bezier(0.22, 0.61, 0.36, 1) both; }
  .stagger > *:nth-child(1) { animation-delay: 0ms; }
  .stagger > *:nth-child(2) { animation-delay: 50ms; }
  .stagger > *:nth-child(3) { animation-delay: 100ms; }
  .stagger > *:nth-child(4) { animation-delay: 150ms; }
  .stagger > *:nth-child(5) { animation-delay: 200ms; }
  .stagger > *:nth-child(6) { animation-delay: 250ms; }
  .stagger > *:nth-child(7) { animation-delay: 300ms; }

  /* Toast */
  .toast { animation: fadeUp 240ms ease-out, fadeOutToast 240ms ease-in 2.4s forwards; }
  @keyframes fadeOutToast { to { opacity: 0; transform: translateY(-4px); } }

  /* Check box */
  .check-box {
    width: 20px; height: 20px; border-radius: 6px;
    border: 1.5px solid var(--line2);
    display: inline-flex; align-items: center; justify-content: center;
    transition: all 180ms ease; flex-shrink: 0; background: var(--canvas);
  }
  .check-box.checked { background: var(--ink2); border-color: var(--ink2); }
  .check-box.checked svg { opacity: 1; transform: scale(1); }
  .check-box svg { opacity: 0; transform: scale(0.6); transition: all 180ms ease; }

  /* Input */
  .input {
    background: var(--canvas);
    border: 1px solid var(--line2);
    color: var(--ink);
    transition: all 180ms ease;
    font-feature-settings: "cv02","cv03","cv04","cv11";
  }
  .input:focus {
    outline: none;
    border-color: var(--ink);
    box-shadow: 0 0 0 3px rgba(63,77,81,0.06);
  }
  .input::placeholder { color: var(--muted2); }

  /* Pill tabs */
  .pill {
    transition: all 150ms ease;
    background: transparent;
    color: var(--muted);
  }
  .pill:hover { color: var(--ink); }
  .pill.active { background: var(--ink2); color: var(--canvas); }

  /* Editorial hero — subtle paper texture + warm tone */
  .hero-grain {
    background-image:
      radial-gradient(ellipse 80% 50% at 20% 0%, rgba(201,139,44,0.05), transparent 50%),
      radial-gradient(ellipse 80% 50% at 80% 100%, rgba(191,95,73,0.03), transparent 50%);
  }

  /* Certificate */
  .cert {
    background:
      radial-gradient(ellipse at top, rgba(201,139,44,0.04), transparent 60%),
      var(--canvas);
    border: 1px solid var(--line);
  }

  /* Chevron */
  .chev-r { transition: transform 200ms ease; }
  .rotated { transform: rotate(90deg); }

  /* Mobile */
  @media (max-width: 768px) {
    .desktop-only { display: none !important; }
  }
  @media (min-width: 769px) {
    .mobile-only { display: none !important; }
  }

  /* Selection */
  ::selection { background: rgba(201,139,44,0.22); color: var(--ink2); }

  /* Focus */
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--ochre);
    outline-offset: 2px;
    border-radius: 6px;
  }

  /* Tabular numbers */
  .tabular-nums { font-variant-numeric: tabular-nums; }

  /* Detail line — editorial device */
  .detail-line::before {
    content: ''; display: inline-block;
    width: 24px; height: 1px; background: var(--line2);
    margin-right: 12px; vertical-align: middle;
  }
</style>
</head>

function Toast({ message, onDone }) {
  useEffect(() => { const t = setTimeout(onDone, 2700); return () => clearTimeout(t); }, []);
  return (
    <div className="toast fixed bottom-20 md:bottom-6 left-1/2 -translate-x-1/2 z-50 bg-ink2 text-canvas px-4 py-2.5 rounded-xl shadow-lg flex items-center gap-2.5 text-[13px]">
      <I.check className="w-3.5 h-3.5" /> <span>{message}</span>
    </div>
  );
}

function ProgressBar({ value, height = 2 }) {
  return (
    <div className="progress-track rounded-full overflow-hidden" style={{height: `${height}px`}}>
      <div className="progress-fill h-full rounded-full" style={{width: `${value}%`}}></div>
    </div>
  );
}

function Pill({ children, tone = 'neutral' }) {
  const tones = {
    neutral:  'bg-cream text-muted border border-line',
    dark:     'bg-ink2 text-canvas',
    ochre:    'bg-ochre/10 text-ochre',
    success:  'bg-success/10 text-success',
    warning:  'bg-warning/10 text-warning',
    danger:   'bg-danger/10 text-danger',
    outline:  'border border-line2 text-ink2',
  };
  return <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium ${tones[tone]}`}>{children}</span>;
}

  const flashWarning = (msg) => { setWarning(msg); setTimeout(() => setWarning(null), 2400); };

  useEffect(() => {
    const handlers = {
      contextmenu: (e) => { e.preventDefault(); flashWarning('Right-click is disabled'); },
      keydown: (e) => {
        if ((e.ctrlKey || e.metaKey) && ['s','p','c','a','u'].includes(e.key.toLowerCase())) {
          e.preventDefault(); flashWarning('Disabled to protect curriculum IP');
        }
        if (e.key === 'PrintScreen') flashWarning('Screenshots are discouraged');
        if (e.key === 'F12') { e.preventDefault(); flashWarning('Developer tools disabled'); }
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && ['i','j','c'].includes(e.key.toLowerCase())) {
          e.preventDefault(); flashWarning('Developer tools disabled');
        }
      },
      copy: (e) => { e.preventDefault(); flashWarning('Copying is disabled'); },
      dragstart: (e) => e.preventDefault(),
    };
    Object.entries(handlers).forEach(([k,fn]) => document.addEventListener(k, fn));
    return () => Object.entries(handlers).forEach(([k,fn]) => document.removeEventListener(k, fn));
  }, []);

  return (

function ProgressRing({ value, size = 60, dark = false }) {
  const r = size/2 - 3;
  const c = 2 * Math.PI * r;
  const offset = c - (value/100) * c;
  return (
    <svg width={size} height={size} className="-rotate-90 shrink-0">
      <circle cx={size/2} cy={size/2} r={r} fill="none" strokeWidth="2.5" stroke={dark ? 'rgba(253,251,246,0.15)' : 'var(--line)'}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" strokeWidth="2.5" strokeLinecap="round"
        stroke={dark ? 'rgba(253,251,246,0.9)' : 'var(--ink2)'}
        strokeDasharray={c} strokeDashoffset={offset}
        style={{transition: 'stroke-dashoffset 600ms cubic-bezier(0.22,0.61,0.36,1)'}}/>
      <text x={size/2} y={size/2+4} textAnchor="middle" transform={`rotate(90 ${size/2} ${size/2})`}
        fill={dark ? 'var(--canvas)' : 'var(--ink2)'} fontSize="14" fontWeight="500" fontFamily="Inter" className="tabular-nums">{value}%</text>
    </svg>
  );
}

function QuizLesson({ lesson, onBack, showToast }) {
  const [answers, setAnswers] = useState({});
  const [submitted, setSubmitted] = useState(false);
  const score = Object.entries(answers).reduce((s, [qi, a]) => s + (QUIZ_QUESTIONS[qi].correct === a ? 1 : 0), 0);
  const total = QUIZ_QUESTIONS.length;
  const passed = score / total >= 0.7;

  return (
    <div className="max-w-[720px] mx-auto px-5 md:px-8 py-8 md:py-12 animate-fade-up">
      <BreadcrumbBack onClick={onBack} label="Back to course"/>
      <div className="tracked text-muted2 mb-2">{lesson.module?.title} · Quiz</div>
      <h1 className="text-[32px] md:text-[42px] font-medium display-tight text-ink2 mb-3">{lesson.title}</h1>
      <p className="text-[13px] text-muted mb-10">Answer all questions · 70% required to pass · {total} questions</p>

      <div className="space-y-4">
        {QUIZ_QUESTIONS.map((q, qi) => (
          <div key={q.id} className="card rounded-2xl p-6">
            <div className="flex items-start gap-5 mb-5">
              <div className="serif text-[20px] text-muted2 tabular-nums shrink-0">{String(qi+1).padStart(2,'0')}</div>
              <h3 className="text-[17px] font-medium text-ink2 leading-snug flex-1">{q.question}</h3>
            </div>
            <div className="space-y-2 ml-11">
              {q.options.map((opt, oi) => {
                const selected  = answers[qi] === oi;
                const isCorrect = submitted && oi === q.correct;
                const isWrong   = submitted && selected && oi !== q.correct;
                return (
                  <button key={oi} disabled={submitted}
                    onClick={() => setAnswers({...answers, [qi]: oi})}
                    className={`w-full text-left p-3.5 rounded-xl border transition text-[14px] flex items-center gap-3
                      ${isCorrect ? 'border-success bg-success/5 text-success' : ''}
                      ${isWrong   ? 'border-danger bg-danger/5 text-danger' : ''}
                      ${!submitted && selected ? 'border-ink2 bg-cream text-ink2' : ''}
                      ${!submitted && !selected ? 'border-line hover:border-line2 text-ink2' : ''}`}>
                    <div className={`w-4 h-4 rounded-full border-[1.5px] flex items-center justify-center shrink-0
                      ${isCorrect ? 'border-success bg-success' : ''}
                      ${isWrong   ? 'border-danger bg-danger' : ''}
                      ${!submitted && selected ? 'border-ink2 bg-ink2' : ''}
                      ${!submitted && !selected ? 'border-line2' : ''}`}>
                      {(isCorrect || (!submitted && selected)) && <I.check className="w-2.5 h-2.5 text-canvas" style={{strokeWidth:3}}/>}
                      {isWrong && <I.x className="w-2.5 h-2.5 text-canvas" style={{strokeWidth:3}}/>}
                    </div>
                    <span>{opt}</span>
                  </button>
                );
              })}
            </div>
            {submitted && (
              <div className="ml-11 mt-3 p-3 rounded-xl card-sunken text-[13px] text-ink">
                <div className="font-medium text-ink2 mb-1">Explanation</div>
                {q.explanation}
              </div>
            )}
          </div>
        ))}
      </div>

      {!submitted ? (
        <button disabled={Object.keys(answers).length !== total} onClick={() => setSubmitted(true)}
          className="btn-primary mt-8 w-full py-3.5 rounded-full text-[13px] disabled:opacity-30 disabled:cursor-not-allowed">
          Submit quiz
        </button>
      ) : (
        <div className="mt-8 card rounded-2xl p-6">
          <div className="flex items-center gap-4 mb-4">
            <div className={`w-10 h-10 rounded-full flex items-center justify-center ${passed ? 'bg-success text-canvas' : 'bg-danger text-canvas'}`}>
              {passed ? <I.check className="w-5 h-5"/> : <I.x className="w-5 h-5"/>}
            </div>
            <div>
              <div className="text-[17px] font-medium text-ink2">{passed ? 'You passed' : 'Not quite there'}</div>
              <div className="text-[13px] text-muted tabular-nums">Score: {score} / {total} ({Math.round(score/total*100)}%)</div>
            </div>
          </div>
          <div className="flex gap-3">
            {passed
              ? <button onClick={()=>{showToast('Progress saved'); onBack();}} className="btn-primary px-5 py-2 rounded-full text-[13px]">Continue</button>
              : <button onClick={()=>{setSubmitted(false); setAnswers({});}} className="btn-primary px-5 py-2 rounded-full text-[13px]">Try again</button>}
            <button onClick={onBack} className="btn-ghost px-5 py-2 rounded-full text-[13px]">Back to course</button>
          </div>
        </div>
      )}
    </div>
  );
}

function SOPRunner({ sop, onBack, showToast }) {
  const [completed, setCompleted] = useState({});
  const [photos, setPhotos]       = useState({});
  const [notes,  setNotes]        = useState({});
  const [activeStep,setActiveStep]= useState(0);
  const [started, setStarted]     = useState(false);

  const progress = Math.round(Object.keys(completed).length / sop.steps.length * 100);

  const toggleStep = (id) => {
    setCompleted(c => {
      const n = {...c};
      if (n[id]) delete n[id]; else n[id] = { at: new Date().toISOString() };
      return n;
    });
  };

  const addPhoto = (stepId) => {
    setPhotos(p => ({...p, [stepId]: [...(p[stepId]||[]), { id: Date.now(), name: 'IMG_'+Math.floor(Math.random()*9000+1000)+'.jpg' }]}));
    showToast('Photo uploaded');
  };

  const finish = () => {
    const allDone = Object.keys(completed).length === sop.steps.length;
    const photosOk = sop.steps.filter(s => s.requiresPhoto).every(s => photos[s.id]?.length);
    if (!allDone)   return showToast('Some steps are incomplete');
    if (!photosOk)  return showToast('Photo checkpoints missing');
    showToast('Execution logged');
    setTimeout(onBack, 700);
  };

  if (!started) {
    return (
      <div className="max-w-[720px] mx-auto px-5 md:px-8 py-8 md:py-12 animate-fade-up">
        <BreadcrumbBack onClick={onBack} label="All SOPs"/>
        <div className="card rounded-2xl p-8">
          <div className="tracked text-muted2 mb-3">{sop.linkedClass}</div>
          <h1 className="text-[32px] md:text-[44px] font-medium display-tight text-ink2 mb-5">{sop.title}</h1>
          <div className="flex items-center gap-3 text-[13px] text-muted mb-10 flex-wrap">
            <span className="inline-flex items-center gap-1.5"><I.clock className="w-3.5 h-3.5"/>{sop.duration}</span>
            <span className="text-muted2">·</span>
            <span>{sop.steps.length} steps</span>
            <span className="text-muted2">·</span>
            <span>{sop.steps.filter(s=>s.requiresPhoto).length} photo checkpoints</span>
          </div>

          <div className="tracked text-muted2 mb-3">Materials to prepare</div>
          <div className="grid sm:grid-cols-2 gap-2 mb-10">
            {sop.materials.map(m => (
              <div key={m} className="flex items-center gap-2.5 p-2.5 rounded-lg card-sunken text-[13px] text-ink">
                <div className="check-box"><I.check className="w-3 h-3 text-canvas"/></div>
                <span>{m}</span>
              </div>
            ))}
          </div>

          <div className="tracked text-muted2 mb-3">Steps overview</div>
          <div className="space-y-px bg-line rounded-xl overflow-hidden border hairline mb-10">
            {sop.steps.map((s, i) => (
              <div key={s.id} className="flex items-start gap-4 p-4 bg-canvas">
                <div className="serif text-[16px] text-muted2 tabular-nums shrink-0 w-6">{String(i+1).padStart(2,'0')}</div>
                <div className="flex-1">
                  <div className="text-[13px] font-medium text-ink2">{s.title}</div>
                  <div className="text-[11px] text-muted mt-0.5 flex items-center gap-1.5">
                    <span className="tabular-nums">{s.time}</span>
                    {s.requiresPhoto && <><span className="text-muted2">·</span><span className="inline-flex items-center gap-1"><I.camera className="w-3 h-3"/>Photo required</span></>}
                  </div>
                </div>
              </div>
            ))}
          </div>

          <button onClick={() => setStarted(true)} className="btn-primary w-full py-3.5 rounded-full text-[13px] inline-flex items-center justify-center gap-2">
            <I.play className="w-3.5 h-3.5"/> Start execution
          </button>
        </div>
      </div>
    );
  }

  return (
    <div className="animate-fade-up">
      <div className="sticky top-14 z-20 bg-paper/90 backdrop-blur-xl hairline-b px-5 md:px-8 py-3">
        <div className="max-w-[720px] mx-auto flex items-center gap-3">
          <button onClick={onBack} className="p-1.5 -ml-1.5 hover:bg-cream rounded-lg transition"><I.chevL className="w-4 h-4 text-ink2"/></button>
          <div className="flex-1 min-w-0">
            <div className="text-[11px] text-muted truncate">{sop.title}</div>
            <div className="flex items-center gap-2 mt-1">
              <ProgressBar value={progress}/>
              <div className="text-[11px] font-medium text-ink2 tabular-nums shrink-0">{Object.keys(completed).length}/{sop.steps.length}</div>
            </div>
          </div>
        </div>
      </div>

      <div className="max-w-[720px] mx-auto px-5 md:px-8 py-6">
        <div className="space-y-2.5">
          {sop.steps.map((step, i) => {
            const isCompleted = !!completed[step.id];
            const isActive = activeStep === i;
            const stepPhotos = photos[step.id] || [];

            return (
              <div key={step.id}
                onClick={() => !isCompleted && setActiveStep(i)}
                className={`rounded-2xl border transition overflow-hidden
                  ${isCompleted ? 'bg-cream/50 hairline' : isActive ? 'bg-canvas border-ink2' : 'bg-canvas hairline cursor-pointer hover:border-line2'}`}>
                <div className="p-4 md:p-5 flex items-start gap-4">
                  <button onClick={e => { e.stopPropagation(); toggleStep(step.id); }} className={`check-box ${isCompleted ? 'checked' : ''} mt-0.5`}>
                    <I.check className="w-3 h-3 text-canvas"/>
                  </button>
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center justify-between gap-2 mb-0.5">
                      <div className="flex items-center gap-2">
                        <span className="serif text-[13px] text-muted2 tabular-nums">Step {String(i+1).padStart(2,'0')}</span>
                        <span className="text-[11px] text-muted">{step.time}</span>
                      </div>
                      {step.requiresPhoto && (
                        <Pill tone={stepPhotos.length ? 'success' : 'warning'}><I.camera className="w-3 h-3"/>{stepPhotos.length ? 'Done' : 'Needed'}</Pill>
                      )}
                    </div>
                    <h3 className={`text-[15px] font-medium leading-tight ${isCompleted ? 'text-muted line-through' : 'text-ink2'}`}>{step.title}</h3>

                    {(isActive || isCompleted) && (
                      <>
                        <p className="text-[13px] text-ink mt-2 leading-relaxed">{step.desc}</p>
                        {step.requiresPhoto && (
                          <div className="mt-4">
                            <div className="text-[11px] text-muted2 mb-2">{step.photoPrompt}</div>
                            <div className="flex flex-wrap gap-2">
                              {stepPhotos.map(p => (
                                <div key={p.id} className="w-16 h-16 rounded-lg bg-ink2 flex items-center justify-center relative">
                                  <I.image className="w-5 h-5 text-canvas/60"/>
                                </div>
                              ))}
                              <button onClick={e => { e.stopPropagation(); addPhoto(step.id); }}
                                className="w-16 h-16 rounded-lg border border-dashed border-line2 hover:border-ink2 text-muted2 hover:text-ink2 transition flex flex-col items-center justify-center gap-0.5">
                                <I.camera className="w-4 h-4"/>
                                <span className="text-[9px]">Add</span>
                              </button>
                            </div>
                          </div>
                        )}
                        {isActive && !isCompleted && (
                          <textarea value={notes[step.id] || ''} onChange={e => setNotes({...notes, [step.id]: e.target.value})}
                            placeholder="Optional notes…" rows="2"
                            className="input mt-3 w-full p-3 text-[13px] rounded-lg resize-none"/>
                        )}
                      </>
                    )}
                  </div>
                </div>
              </div>
            );
          })}
        </div>

        <div className="mt-8 card rounded-2xl p-5 flex items-center justify-between flex-wrap gap-3">
          <div>
            <div className="tracked text-muted2 mb-1">Summary</div>
            <div className="text-[14px] font-medium text-ink2 tabular-nums">{Object.keys(completed).length} of {sop.steps.length} steps · {Object.values(photos).flat().length} photos</div>
          </div>
          <button onClick={finish} disabled={Object.keys(completed).length === 0}
            className="btn-primary px-5 py-2.5 rounded-full text-[13px] disabled:opacity-30 inline-flex items-center gap-2">
            <I.check className="w-3.5 h-3.5"/> Submit log
          </button>
        </div>
      </div>
    </div>
  );
}

      </div>

      <div className="hairline-b flex gap-6 mb-8">

                  return (
                    <button key={a.id} onClick={() => toggleArea(a.id)}

          <div className="space-y-3">
            {EYFS_AREAS.map(a => {

        </div>
      )}
    </div>
  );
}

            <div className="col-span-3 text-[13px] text-ink">{u.store}</div>
            <div className="col-span-2 flex items-center justify-end gap-3">
              {u.active ? <Pill tone="success">Active</Pill> : <Pill tone="neutral">Inactive</Pill>}
              <button className="p-1 hover:bg-cream rounded transition"><I.edit className="w-3.5 h-3.5 text-muted2"/></button>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function AdminStores({ showToast }) {
  return (
    <div>
      <div className="flex items-center justify-between mb-5">
        <div className="tracked text-muted2">Franchise locations · {MOCK_STORES.length} total</div>
        <button onClick={() => showToast('Store form opened')} className="btn-primary px-4 py-2 rounded-full text-[13px] inline-flex items-center gap-2">
          <I.plus className="w-3.5 h-3.5"/> New store
        </button>
      </div>
      <div className="grid md:grid-cols-2 lg:grid-cols-3 gap-4 stagger">
        {MOCK_STORES.map(s => (
          <div key={s.id} className="card rounded-2xl p-6">
            <div className="flex items-start justify-between mb-6">
              <div className="w-10 h-10 rounded-xl bg-cream border hairline flex items-center justify-center">
                <I.store className="w-[17px] h-[17px] text-ink2"/>
              </div>
              <Pill tone="success">{s.status}</Pill>
            </div>
            <div className="tracked text-muted2 mb-1 tabular-nums">{s.code}</div>
            <h3 className="text-[20px] font-medium display-tight text-ink2 mb-1">{s.name}</h3>
            <div className="text-[12px] text-muted mb-6">{s.region}</div>
            <div className="grid grid-cols-2 gap-3 pt-4 hairline-t">
              <div><div className="text-[11px] text-muted2">Teachers</div><div className="text-[17px] font-medium text-ink2 tabular-nums mt-0.5">{s.teachers}</div></div>
              <div><div className="text-[11px] text-muted2">Students</div><div className="text-[17px] font-medium text-ink2 tabular-nums mt-0.5">{s.students}</div></div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function AdminRoles() {
  const roles = [
    { name: 'HQ_ADMIN',         desc: 'Head office administrator. Full access to all franchises, data, and configuration.',
      perms: ['View all stores','Create/edit users','Publish curriculum','Publish courses','Review compliance logs'] },
    { name: 'FRANCHISEE_ADMIN', desc: 'Owns a single franchise. Can manage their own store, teachers, and students.',
      perms: ['View own store only','Manage teachers at own store','View all class plans','Assign SOPs','Generate reports'] },
    { name: 'TEACHER',          desc: 'Classroom teacher. Delivers lessons and executes SOPs.',
      perms: ['View assigned classes','Execute SOPs','Create observations','Complete trainings','View class plans (if unlocked)'] },
    { name: 'PARENT',           desc: 'Read-only access to their own child\'s reports.',
      perms: ['View own child\'s reports','View own child\'s progress'] },
  ];
  return (
    <div className="space-y-3 stagger">
      {roles.map(r => (
        <div key={r.name} className="card rounded-2xl p-6">
          <div className="flex items-start justify-between mb-4 flex-wrap gap-2">
            <div>
              <div className="tracked text-muted2 mb-1.5 tabular-nums">{r.name}</div>
              <p className="text-[14px] text-ink2 max-w-2xl">{r.desc}</p>
            </div>
            <Pill tone="outline">{r.perms.length} permissions</Pill>
          </div>
          <div className="mt-4 flex flex-wrap gap-1.5">
            {r.perms.map(p => <Pill key={p} tone="neutral">{p}</Pill>)}
          </div>
        </div>
      ))}
    </div>
  );
}

function PageHeader({ eyebrow, title, subtitle, right }) {
  return (
    <div className="mb-12 flex items-end justify-between gap-4 flex-wrap">
      <div>
        <div className="tracked text-muted mb-4 detail-line">{eyebrow}</div>
        <h1 className="text-[40px] md:text-[56px] font-medium display-xl text-ink2 mb-4 leading-[1.02]">{title}</h1>
        {subtitle && <p className="text-[16px] md:text-[18px] text-muted max-w-xl leading-relaxed">{subtitle}</p>}
      </div>
      {right && <div>{right}</div>}
    </div>
  );
}

function BreadcrumbBack({ onClick, label }) {
  return (
    <button onClick={onClick} className="flex items-center gap-1.5 text-[13px] mb-6 text-muted hover:text-ink2 transition">
      <I.chevL className="w-4 h-4"/><span>{label}</span>
    </button>
  );
}
