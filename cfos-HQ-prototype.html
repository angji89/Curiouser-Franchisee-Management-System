  .stagger>*:nth-child(3){animation-delay:90ms;}
  .stagger>*:nth-child(4){animation-delay:135ms;}
  .stagger>*:nth-child(5){animation-delay:180ms;}
  .stagger>*:nth-child(6){animation-delay:225ms;}
  .stagger>*:nth-child(7){animation-delay:270ms;}
  .stagger>*:nth-child(8){animation-delay:315ms;}

// ═══════ UTILITIES ═══════
function Toast({ message, onDone }) {
  useEffect(() => { const t = setTimeout(onDone, 2700); return () => clearTimeout(t); }, []);
  return <div className="toast fixed bottom-20 lg:bottom-6 left-1/2 -translate-x-1/2 z-50 bg-ink text-canvas px-4 py-2.5 rounded-xl shadow-lg flex items-center gap-2.5 text-[13px]"><I.check className="w-3.5 h-3.5"/><span>{message}</span></div>;
}
function ProgressBar({ value, height = 3 }) { return <div className="progress-track rounded-full overflow-hidden" style={{height:`${height}px`}}><div className="progress-fill h-full rounded-full" style={{width:`${value}%`}}/></div>; }
function Pill({ children, tone = 'neutral' }) {
  const tones = { neutral:'bg-surface text-muted border border-line', dark:'bg-ink text-canvas', ochre:'bg-ochre/10 text-ochre border border-ochre/20', success:'bg-success/10 text-success border border-success/20', warning:'bg-warning/10 text-warning border border-warning/20', danger:'bg-danger/10 text-danger border border-danger/20', outline:'border border-line2 text-ink bg-canvas' };
  return <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-medium ${tones[tone]}`}>{children}</span>;
}
function healthColor(s) { return s >= 85 ? 'green' : s >= 70 ? 'yellow' : 'red'; }
function healthLabel(s) { return s >= 85 ? 'Excellent' : s >= 70 ? 'Good' : s >= 55 ? 'Needs attention' : 'Critical'; }
function healthHex(s) { return s >= 85 ? '#6b8e7b' : s >= 70 ? '#c98b2c' : '#bf5f49'; }

function PageHeader({ eyebrow, title, subtitle, right }) {
  return (
    <div className="mb-10 lg:mb-12 flex items-end justify-between gap-4 flex-wrap">
      <div>
        <div className="tracked text-muted mb-4 detail-line-ochre">{eyebrow}</div>
        <h1 className="display-serif text-[42px] lg:text-[60px] text-ink mb-4 leading-[1.02]">{title}</h1>
        {subtitle && <p className="text-[15px] lg:text-[16px] text-muted max-w-2xl leading-relaxed">{subtitle}</p>}
      </div>
      {right && <div>{right}</div>}
    </div>
  );
}
function BreadcrumbBack({ onClick, label }) {
  return <button onClick={onClick} className="flex items-center gap-1.5 text-[13px] mb-6 text-muted hover:text-ink transition"><I.chevL className="w-4 h-4"/><span>{label}</span></button>;
}

// Reusable Sheet (right-side slide-in panel for forms)
function Sheet({ open, onClose, title, eyebrow, children, footer, width='720px' }) {
  useEffect(() => {
    if (!open) return;
    const handler = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', handler);
    document.body.style.overflow = 'hidden';
    return () => {
      document.removeEventListener('keydown', handler);
      document.body.style.overflow = '';
    };
  }, [open]);

  if (!open) return null;
  return (
    <div className="fixed inset-0 z-50 flex justify-end">
      <div className="absolute inset-0 bg-ink/30 backdrop-blur-sm animate-fade-up" onClick={onClose}/>
      <div className="relative bg-paper hairline-l border-l shadow-2xl animate-fade-up flex flex-col w-full" style={{maxWidth:width, animationDuration:'320ms'}}>
        <div className="flex items-start justify-between p-6 lg:p-7 hairline-b shrink-0 bg-paper2/40">
          <div className="min-w-0">
            {eyebrow && <div className="tracked text-muted2 mb-1.5 detail-line-ochre">{eyebrow}</div>}
            <h2 className="display-serif text-[28px] lg:text-[32px] text-ink leading-tight" style={{fontWeight:500}}>{title}</h2>
          </div>
          <button onClick={onClose} className="p-2 hover:bg-surface rounded-lg transition shrink-0"><I.x className="w-5 h-5 text-muted"/></button>
        </div>

        <div className="flex-1 overflow-y-auto p-6 lg:p-7">
          {children}
        </div>

        {footer && (
          <div className="hairline-t bg-paper2/40 p-5 lg:p-6 shrink-0">
            {footer}
          </div>
        )}
      </div>
    </div>
  );
}

// Upload zone — drag/drop simulation that just adds to a list
function UploadZone({ accept, label, hint, onAdd, multiple = true, compact = false }) {
  const inputRef = useRef(null);
  const fakeUpload = () => {
    const sampleNames = {
      'video': ['Welcome_to_Curiouser.mp4','Drama_Foundations_Module_1.mp4','Storytelling_Demo.mp4'],
      'image': ['hero_poster_A2.png','social_square.png','social_story.png','referral_card.png'],
      'doc':   ['Cognitive_Milestones_Reference.pdf','Companion_Slides.pptx','Lesson_Script.docx','Email_Template.docx'],
      'all':   ['Marketing_Plan.pdf','Campaign_Brief.docx','Brand_Guide.pdf'],
    };
    const pool = sampleNames[accept] || sampleNames.all;
    const fileName = pool[Math.floor(Math.random() * pool.length)];
    const sizeKb = Math.floor(Math.random() * 4000 + 200);
    const ext = fileName.split('.').pop().toLowerCase();
    const type =
      ['mp4','mov','webm'].includes(ext)        ? 'video' :
      ['png','jpg','jpeg','svg'].includes(ext)  ? 'image' :
      ['pdf'].includes(ext)                     ? 'pdf'   :
      ['ppt','pptx'].includes(ext)              ? 'ppt'   :
      ['doc','docx'].includes(ext)              ? 'doc'   : 'doc';
    onAdd({
      id: `f${Date.now()}${Math.random().toString(36).slice(2,6)}`,
      name: fileName,
      type,
      meta: type === 'video' ? `MP4 · ${(sizeKb/1024).toFixed(1)} MB · 5:24` :
            type === 'image' ? `PNG · ${(sizeKb).toLocaleString()} KB`        :
            type === 'pdf'   ? `PDF · ${Math.ceil(sizeKb/200)} pages`         :
            type === 'ppt'   ? `PPT · ${Math.ceil(sizeKb/100)} slides`        :
                               `Word · ${Math.ceil(sizeKb/120)} pages`,
    });
  };

  if (compact) {
    return (
      <button onClick={fakeUpload} className="btn-ghost px-3 py-2 rounded-lg text-[12px] inline-flex items-center gap-2">
        <I.upload className="w-3.5 h-3.5"/>{label || 'Add file'}
      </button>
    );
  }

  return (
    <button onClick={fakeUpload} className="w-full border-2 border-dashed border-line2 hover:border-ink rounded-2xl p-8 text-center transition group bg-surface/40">
      <div className="w-12 h-12 mx-auto mb-3 rounded-xl bg-canvas hairline border flex items-center justify-center text-ink group-hover:bg-ink group-hover:text-canvas transition">
        <I.upload className="w-5 h-5"/>
      </div>
      <div className="text-[13.5px] font-medium text-ink mb-1">{label || 'Drop files here'}</div>
      <div className="text-[11.5px] text-muted">{hint || 'Or click to browse'}</div>
    </button>
  );
}

// Repeating list of bullet/text items (for goals, outcomes, materials, hashtags)
function RepeatingList({ items, onChange, placeholder, addLabel = 'Add item' }) {
  const update = (i, v) => onChange(items.map((it, idx) => idx === i ? v : it));
  const remove = (i) => onChange(items.filter((_, idx) => idx !== i));
  const add = () => onChange([...items, '']);

  return (
    <div className="space-y-2">
      {items.map((it, i) => (
        <div key={i} className="flex items-center gap-2">
          <span className="display-serif text-muted2 tabular-nums w-6 shrink-0 text-[14px]" style={{fontWeight:400}}>{String(i+1).padStart(2,'0')}</span>
          <input
            value={it}
            onChange={e => update(i, e.target.value)}
            placeholder={placeholder}
            className="input flex-1 px-3 py-2 rounded-lg text-[13.5px]"
          />
          <button onClick={()=>remove(i)} className="p-1.5 hover:bg-surface rounded-md transition shrink-0"><I.x className="w-3.5 h-3.5 text-muted2"/></button>
        </div>
      ))}
      <button onClick={add} className="text-[12px] text-ochre hover:text-ochre2 inline-flex items-center gap-1.5 pt-1 transition font-medium">
        <I.plus className="w-3 h-3"/> {addLabel}
      </button>
    </div>
  );
}

              {pinned ? 'Pinned' : 'Not pinned'}

      <FormSection title="The message" hint="Excerpt shows on every dashboard. Body shows when franchisees open the announcement.">

        </Field>

      <FormSection title="Call to action" hint="Add a button that links franchisees somewhere in the system">
        <button onClick={()=>setHasAction(!hasAction)} className={`w-full mb-3 px-3 py-2 rounded-lg text-[13px] font-medium border hairline transition ${hasAction ? 'bg-ochre/10 text-ochre border-ochre/30' : 'bg-surface text-muted hover:text-ink'}`}>

        {hasAction && (

  );

// ═══════ COURSE / TRAINING EDITOR ═══════
function CourseEditor({ open, course, onClose, onSave, showToast }) {
  const isEdit = !!course;
  const [title, setTitle] = useState('');
  const [subtitle, setSubtitle] = useState('');
  const [description, setDescription] = useState('');
  const [level, setLevel] = useState('Foundation');
  const [hours, setHours] = useState(2);
  const [required, setRequired] = useState(false);
  const [instructor, setInstructor] = useState('');
  const [instructorTitle, setInstructorTitle] = useState('');
  const [modules, setModules] = useState([{ id:`m1`, title:'', lessons:[] }]);
  const [editingLesson, setEditingLesson] = useState(null); // { moduleIdx, lessonIdx }

  useEffect(() => {
    if (course) {
      setTitle(course.title); setSubtitle(course.subtitle); setDescription(course.description);
      setLevel(course.level); setHours(course.hours); setRequired(course.required);
      setInstructor(course.instructor); setInstructorTitle(course.instructorTitle || '');
      setModules(course.modules || []);
    } else if (open) {
      setTitle(''); setSubtitle(''); setDescription(''); setLevel('Foundation');
      setHours(2); setRequired(false); setInstructor(''); setInstructorTitle('');
      setModules([{ id:`m1`, title:'', lessons:[] }]);
    }
  }, [course, open]);

  const canSave = title.trim() && description.trim() && instructor.trim() && modules.some(m => m.title.trim());

  const addModule = () => setModules([...modules, { id:`m${modules.length+1}`, title:'', lessons:[] }]);
  const updateModule = (i, key, val) => setModules(modules.map((m, idx) => idx === i ? { ...m, [key]: val } : m));
  const removeModule = (i) => setModules(modules.filter((_, idx) => idx !== i));

  const addLesson = (mIdx) => {
    const newLesson = {
      id:`l${Date.now()}`,
      title:'New lesson',
      type:'video',
      duration:5,
      description:'',
      outcomes:[''],
      resources:[],
      transcript:'',
      notes:'',
      videoFile:null,
      completed:false,
    };
    setModules(modules.map((m, idx) => idx === mIdx ? { ...m, lessons: [...m.lessons, newLesson] } : m));
    setEditingLesson({ moduleIdx: mIdx, lessonIdx: modules[mIdx].lessons.length });
  };
  const removeLesson = (mIdx, lIdx) => {
    setModules(modules.map((m, idx) => idx === mIdx ? { ...m, lessons: m.lessons.filter((_, li) => li !== lIdx) } : m));
  };

  const save = () => {
    if (!canSave) return;
    onSave({
      id: course?.id || `c${Date.now()}`,
      title, subtitle, description, level, hours, required, instructor, instructorTitle,
      modules: modules.filter(m => m.title.trim()),
      progress: course?.progress || 0,
    });
    showToast(isEdit ? 'Course updated · franchisees notified' : 'Course published · live to all stores');
    onClose();
  };

  // Lesson editor sub-sheet
  const lesson = editingLesson ? modules[editingLesson.moduleIdx]?.lessons[editingLesson.lessonIdx] : null;
  const updateLessonField = (key, val) => {
    setModules(modules.map((m, mi) =>
      mi === editingLesson.moduleIdx
        ? { ...m, lessons: m.lessons.map((l, li) => li === editingLesson.lessonIdx ? { ...l, [key]: val } : l) }
        : m
    ));
  };

  return (
    <>
      <Sheet open={open && !editingLesson} onClose={onClose} width="900px"
        eyebrow={isEdit ? 'Edit course' : 'New training course'}
        title={title || (isEdit ? 'Edit course' : 'New course')}
        footer={
          <div className="flex items-center justify-between gap-3 flex-wrap">
            <div className="text-[11.5px] text-muted">
              {modules.length} module{modules.length !== 1 ? 's' : ''} · {modules.reduce((sum,m)=>sum+m.lessons.length,0)} lesson{modules.reduce((sum,m)=>sum+m.lessons.length,0) !== 1 ? 's' : ''}
            </div>
            <div className="flex gap-2">
              <button onClick={onClose} className="btn-ghost px-5 py-2.5 rounded-full text-[13px]">Cancel</button>
              <button onClick={save} disabled={!canSave} className="btn-primary px-5 py-2.5 rounded-full text-[13px] inline-flex items-center gap-2 disabled:opacity-40">
                <I.send className="w-3.5 h-3.5"/> {isEdit ? 'Save changes' : 'Publish course'}

            </div>
          </div>
        }>

          <Field label="Course title" required>
            <input value={title} onChange={e=>setTitle(e.target.value)} placeholder="Foundations of Drama Teaching" className="input w-full px-3 py-2.5 rounded-lg text-[14px]"/>
          </Field>
          <Field label="Subtitle / tag line">
            <input value={subtitle} onChange={e=>setSubtitle(e.target.value)} placeholder="Required to unlock Drama curriculum" className="input w-full px-3 py-2.5 rounded-lg text-[13.5px]"/>
          </Field>
          <Field label="Description" required>
            <textarea value={description} onChange={e=>setDescription(e.target.value)} rows="3" placeholder="What the franchisee will learn from this course…" className="input w-full p-3 rounded-lg text-[13.5px] resize-none"/>

            <Field label="Level">
              <select value={level} onChange={e=>setLevel(e.target.value)} className="input w-full px-3 py-2.5 rounded-lg text-[13.5px]">

                <option>Intermediate</option>
                <option>Advanced</option>
              </select>
            </Field>
            <Field label="Estimated hours">
              <input type="number" step="0.5" min="0.5" value={hours} onChange={e=>setHours(parseFloat(e.target.value)||0)} className="input w-full px-3 py-2.5 rounded-lg text-[13.5px] tabular-nums"/>
            </Field>
          </div>
          <div className="grid md:grid-cols-2 gap-4">
            <Field label="Instructor name" required>
              <input value={instructor} onChange={e=>setInstructor(e.target.value)} placeholder="Dr. Elena Hoffmann" className="input w-full px-3 py-2.5 rounded-lg text-[13.5px]"/>
            </Field>
            <Field label="Instructor title">
              <input value={instructorTitle} onChange={e=>setInstructorTitle(e.target.value)} placeholder="Head of Curriculum" className="input w-full px-3 py-2.5 rounded-lg text-[13.5px]"/>
            </Field>
          </div>
          <Field label="Required course">
            <button onClick={()=>setRequired(!required)} className={`px-3 py-2 rounded-lg text-[13px] font-medium transition border hairline inline-flex items-center gap-2 ${required ? 'bg-ink text-canvas border-ink' : 'bg-surface text-muted hover:text-ink'}`}>
              {required ? '✓ Required for all teachers' : 'Optional'}
            </button>
          </Field>
        </FormSection>

        <FormSection title="Course structure" hint="Modules group lessons. Lessons are videos, readings, or quizzes — each carries its own resources, transcript, and notes.">
          <div className="space-y-4">
            {modules.map((mod, mi) => (
              <div key={mod.id} className="card-sunken rounded-xl p-5">

                  <span className="display-serif text-[22px] text-muted2 tabular-nums shrink-0" style={{fontWeight:400}}>{String(mi+1).padStart(2,'0')}</span>

                    value={mod.title}

                    className="input flex-1 px-3 py-2 rounded-lg text-[14px] font-medium"
                  />
                  <button onClick={()=>removeModule(mi)} className="p-1.5 hover:bg-surface rounded-md transition shrink-0"><I.x className="w-3.5 h-3.5 text-muted2"/></button>

                <div className="space-y-2 ml-9">
                  {mod.lessons.map((lesson, li) => {
                    const Icon = lesson.type === 'video' ? I.video : lesson.type === 'reading' ? I.doc : I.clip;

                      <div key={lesson.id} className="card rounded-lg p-3 flex items-center gap-3">

                          <div className="text-[11px] text-muted capitalize">
                            {lesson.type} · {lesson.duration} min
                            {lesson.videoFile && ' · video uploaded'}
                            {lesson.resources?.length > 0 && ` · ${lesson.resources.length} resource${lesson.resources.length !== 1 ? 's' : ''}`}
                            {lesson.transcript && ' · transcript'}
                          </div>
                        </div>
                        <button onClick={()=>setEditingLesson({ moduleIdx: mi, lessonIdx: li })} className="p-1.5 hover:bg-surface rounded-md transition" title="Edit"><I.edit className="w-3.5 h-3.5 text-muted2"/></button>

                  <button onClick={()=>addLesson(mi)} className="text-[12px] text-ochre hover:text-ochre2 inline-flex items-center gap-1.5 pt-1 transition font-medium">
                    <I.plus className="w-3 h-3"/> Add lesson

                </div>

          </div>

            <I.plus className="w-3.5 h-3.5"/> Add module
          </button>
        </FormSection>
      </Sheet>

      {/* Lesson editor — nested sheet */}
      {editingLesson && lesson && (
        <LessonEditor
          lesson={lesson}
          onClose={()=>setEditingLesson(null)}
          onChange={updateLessonField}

}

function LessonEditor({ lesson, onClose, onChange, showToast }) {

        </Field>
        <div className="grid md:grid-cols-2 gap-4">
          <Field label="Type">
            <select value={lesson.type} onChange={e=>onChange('type', e.target.value)} className="input w-full px-3 py-2.5 rounded-lg text-[13.5px]">

              <option value="reading">Reading</option>
              <option value="quiz">Quiz</option>

          </Field>
        </div>
        <Field label="Description" hint="Shown in the About tab when the lesson opens">
          <textarea value={lesson.description} onChange={e=>onChange('description', e.target.value)} rows="3" placeholder="In this lesson, we explore…" className="input w-full p-3 rounded-lg text-[13.5px] resize-none"/>
        </Field>
      </FormSection>

      {lesson.type === 'video' && (
        <FormSection title="Video file" hint="MP4, MOV or WebM. Streams in the player at the top of the lesson page.">
          {lesson.videoFile ? (
            <FileChip file={lesson.videoFile} onRemove={()=>onChange('videoFile', null)}/>
          ) : (
            <UploadZone accept="video" label="Upload video" hint="Up to 500 MB · MP4, MOV, WebM" onAdd={f => onChange('videoFile', f)}/>
          )}
        </FormSection>
      )}

      <FormSection title="Learning outcomes" hint="Bulleted list shown on the About tab. Each line becomes one outcome.">
        <RepeatingList
          items={lesson.outcomes || ['']}
          onChange={v => onChange('outcomes', v)}
          placeholder="Identify three cognitive milestones typical of ages 5–6"
          addLabel="Add outcome"
        />
      </FormSection>

      <FormSection title="Resources" hint="PDFs, slide decks (PPT), Word scripts, images. Franchisees download these from the Resources tab.">
        <UploadZone
          accept="doc"
          label="Add slide deck, PDF, script"
          hint="PDF · PPT · DOCX · PNG"
          onAdd={f => onChange('resources', [...(lesson.resources||[]), f])}
        />
        {lesson.resources?.length > 0 && (
          <div className="space-y-2 mt-4">
            {lesson.resources.map((r, i) => (
              <FileChip
                key={r.id}
                file={r}
                onRemove={()=>onChange('resources', lesson.resources.filter((_, idx) => idx !== i))}
              />
            ))}
          </div>
        )}
      </FormSection>

      <FormSection title="Transcript" hint="Full text of the lesson. Shown on the Transcript tab. Optional but improves accessibility.">
        <textarea
          value={lesson.transcript || ''}
          onChange={e=>onChange('transcript', e.target.value)}
          rows="8"
          placeholder="In this lesson, we'll explore…"
          className="input w-full p-3 rounded-lg text-[13.5px] resize-none font-mono"
          style={{fontFamily:'ui-monospace,SFMono-Regular,Menlo,monospace',fontSize:'12.5px'}}
        />
      </FormSection>
    </Sheet>
  );
}

function MetricCell({ value, threshold, suffix }) {
  const color = value >= threshold.good ? 'text-success' : value >= threshold.ok ? 'text-ochre' : 'text-coral';
  return <td className="px-3 py-4 text-right tabular-nums"><div className={`${color} font-medium`}>{value}{suffix}</div></td>;
}

function KPICard({ icon: Icon, eyebrow, value, change, trend, spark }) {
  const trendColor = trend === 'up' ? 'text-success' : trend === 'down' ? 'text-coral' : 'text-muted';
  const TrendIcon = trend === 'up' ? I.trend : trend === 'down' ? I.trendD : null;
  return (
    <div className="card rounded-2xl p-5 lg:p-6">
      <div className="flex items-center justify-between mb-5">
        <div className="w-9 h-9 rounded-lg bg-surface hairline border flex items-center justify-center">
          <Icon className="w-4 h-4 text-ink"/>
        </div>
        {spark && <Sparkline data={spark} width={72} height={28}/>}
      </div>
      <div className="tracked text-muted2 mb-1.5">{eyebrow}</div>
      <div className="display-sans text-[28px] lg:text-[32px] text-ink tabular-nums mb-1">{value}</div>
      <div className={`text-[11.5px] font-medium inline-flex items-center gap-0.5 ${trendColor}`}>
        {TrendIcon && <TrendIcon className="w-3 h-3"/>}{change}
      </div>
    </div>
  );
}

function Sparkline({ data, width = 80, height = 30, color }) {
  const max = Math.max(...data), min = Math.min(...data);
  const range = max - min || 1;
  const points = data.map((v, i) => {
    const x = (i / (data.length - 1)) * width;
    const y = height - ((v - min) / range) * (height - 4) - 2;
    return `${x},${y}`;
  }).join(' ');
  return <svg width={width} height={height} className="overflow-visible"><polyline points={points} className="sparkline" style={{stroke:color||'var(--ink)'}}/></svg>;
}

function RevenueChart({ data }) {
  const months = ['May','Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar','Apr'];
  const max = Math.max(...data);
  const target = 130;
  const width = 100;
  const height = 200;
  return (
    <div className="relative">
      <svg viewBox={`0 0 ${width} ${height}`} preserveAspectRatio="none" className="w-full h-[200px]">
        <line x1="0" y1={height - (target/max)*height*0.85} x2={width} y2={height - (target/max)*height*0.85} stroke="var(--ochre)" strokeWidth="0.25" strokeDasharray="1,1" opacity="0.6"/>
        <polygon points={`0,${height} ${data.map((v,i)=>`${(i/(data.length-1))*width},${height-(v/max)*height*0.85}`).join(' ')} ${width},${height}`} fill="url(#revgrad)" opacity="0.3"/>
        <polyline points={data.map((v,i)=>`${(i/(data.length-1))*width},${height-(v/max)*height*0.85}`).join(' ')} fill="none" stroke="var(--ink)" strokeWidth="0.5" strokeLinecap="round" strokeLinejoin="round" vectorEffect="non-scaling-stroke"/>
        <defs><linearGradient id="revgrad" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stopColor="var(--ink)" stopOpacity="0.4"/><stop offset="100%" stopColor="var(--ink)" stopOpacity="0"/></linearGradient></defs>
        {data.map((v,i)=><circle key={i} cx={(i/(data.length-1))*width} cy={height-(v/max)*height*0.85} r="0.4" fill="var(--ink)" vectorEffect="non-scaling-stroke"/>)}
      </svg>
      <div className="flex justify-between text-[10.5px] text-muted2 mt-3 px-1">
        {months.map((m, i) => <span key={i} className={i === months.length-1 ? 'text-ink font-medium' : ''}>{m}</span>)}
      </div>
    </div>
  );
}

function HealthRing({ value, size }) {
  const strokeWidth = 8;
  const r = size/2 - strokeWidth;
  const c = 2 * Math.PI * r;
  const offset = c - (value/100) * c;
  const color = healthHex(value);
  return (
    <svg width={size} height={size} className="-rotate-90 shrink-0">
      <circle cx={size/2} cy={size/2} r={r} fill="none" strokeWidth={strokeWidth} stroke="var(--line)"/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" strokeWidth={strokeWidth} strokeLinecap="round" stroke={color} strokeDasharray={c} strokeDashoffset={offset} className="score-ring"/>
      <text x={size/2} y={size/2 - 2} textAnchor="middle" transform={`rotate(90 ${size/2} ${size/2})`} fill="var(--ink)" fontSize={size*0.22} fontWeight="500" fontFamily="Inter" className="tabular-nums">{value}</text>
      <text x={size/2} y={size/2 + 14} textAnchor="middle" transform={`rotate(90 ${size/2} ${size/2})`} fill="var(--muted)" fontSize="10" fontFamily="Inter" style={{letterSpacing:'0.1em',textTransform:'uppercase'}}>avg health</text>
    </svg>
  );
}

function BarChart({ data, max }) {
  const actualMax = max || Math.max(...data.map(d => d.value));
  return (
    <div className="space-y-2.5">
      {data.map(d => (
        <div key={d.label} className="flex items-center gap-3 text-[12px]">
          <div className="w-32 truncate text-ink">{d.label}</div>
          <div className="flex-1 h-6 bg-surface rounded-md overflow-hidden hairline border relative">
            <div className="h-full rounded-md transition-all duration-500" style={{ width:`${(d.value / actualMax) * 100}%`, background:d.color || 'var(--ink)' }}/>
          </div>
          <div className="w-10 text-right text-ink font-medium tabular-nums">{d.value}</div>
        </div>
      ))}
    </div>
  );
}

function QuizLesson({ lesson, onBack, showToast }) {
  const [answers, setAnswers] = useState({});
  const [submitted, setSubmitted] = useState(false);
  const score = Object.entries(answers).reduce((s, [qi, a]) => s + (QUIZ_QUESTIONS[qi].correct === a ? 1 : 0), 0);
  const total = QUIZ_QUESTIONS.length;
  const passed = score / total >= 0.7;

  return (
    <div className="max-w-[720px] mx-auto px-6 lg:px-10 py-8 lg:py-12 animate-fade-up">
      <BreadcrumbBack onClick={onBack} label="Back to course"/>
      <div className="text-[13px] text-ochre font-medium mb-3">{lesson.module?.title} · Quiz</div>
      <h1 className="display-serif text-[38px] lg:text-[48px] text-ink mb-3 leading-[1.04]" style={{fontWeight:500}}>{lesson.title}</h1>
      <p className="text-[13px] text-muted mb-10">Answer all questions · 70% required to pass · {total} questions</p>

      <div className="space-y-4">
        {QUIZ_QUESTIONS.map((q, qi) => (
          <div key={q.id} className="card rounded-2xl p-6">
            <div className="flex items-start gap-5 mb-5">
              <div className="display-serif text-[22px] text-muted2 tabular-nums shrink-0" style={{fontWeight:400}}>{String(qi+1).padStart(2,'0')}</div>
              <h3 className="text-[17px] font-medium text-ink leading-snug flex-1">{q.question}</h3>
            </div>
            <div className="space-y-2 ml-11">
              {q.options.map((opt, oi) => {
                const selected = answers[qi] === oi;
                const isCorrect = submitted && oi === q.correct;
                const isWrong = submitted && selected && oi !== q.correct;
                return (
                  <button key={oi} disabled={submitted} onClick={()=>setAnswers({...answers,[qi]:oi})}
                    className={`w-full text-left p-3.5 rounded-xl border transition text-[14px] flex items-center gap-3
                      ${isCorrect ? 'border-success bg-success/5 text-success' : ''}
                      ${isWrong   ? 'border-danger bg-danger/5 text-danger' : ''}
                      ${!submitted && selected ? 'border-ink bg-surface text-ink' : ''}
                      ${!submitted && !selected ? 'border-line hover:border-line2 text-ink' : ''}`}>
                    <div className={`w-4 h-4 rounded-full border-[1.5px] flex items-center justify-center shrink-0
                      ${isCorrect ? 'border-success bg-success' : ''}
                      ${isWrong   ? 'border-danger bg-danger' : ''}
                      ${!submitted && selected ? 'border-ink bg-ink' : ''}
                      ${!submitted && !selected ? 'border-line2' : ''}`}>
                      {(isCorrect || (!submitted && selected)) && <I.check className="w-2.5 h-2.5 text-canvas" style={{strokeWidth:3}}/>}
                      {isWrong && <I.x className="w-2.5 h-2.5 text-canvas" style={{strokeWidth:3}}/>}
                    </div>
                    <span>{opt}</span>
                  </button>
                );
              })}
            </div>
            {submitted && <div className="ml-11 mt-3 p-3 rounded-xl card-sunken text-[13px] text-ink"><div className="font-medium mb-1">Explanation</div>{q.explanation}</div>}
          </div>
        ))}
      </div>

      {!submitted ? (
        <button disabled={Object.keys(answers).length !== total} onClick={()=>setSubmitted(true)} className="btn-ochre mt-8 w-full py-3.5 rounded-full text-[13px] disabled:opacity-30 disabled:cursor-not-allowed">
          Submit quiz
        </button>
      ) : (
        <div className="mt-8 card rounded-2xl p-6">
          <div className="flex items-center gap-4 mb-4">
            <div className={`w-10 h-10 rounded-full flex items-center justify-center ${passed ? 'bg-success text-canvas' : 'bg-danger text-canvas'}`}>
              {passed ? <I.check className="w-5 h-5"/> : <I.x className="w-5 h-5"/>}
            </div>
            <div>
              <div className="text-[17px] font-medium text-ink">{passed ? 'You passed' : 'Not quite there'}</div>
              <div className="text-[13px] text-muted tabular-nums">Score: {score} / {total} ({Math.round(score/total*100)}%)</div>
            </div>
          </div>
          <div className="flex gap-3">
            {passed
              ? <button onClick={()=>{showToast('Progress saved'); onBack();}} className="btn-ochre px-5 py-2 rounded-full text-[13px]">Continue</button>
              : <button onClick={()=>{setSubmitted(false); setAnswers({});}} className="btn-primary px-5 py-2 rounded-full text-[13px]">Try again</button>}
            <button onClick={onBack} className="btn-ghost px-5 py-2 rounded-full text-[13px]">Back to course</button>
          </div>
        </div>
      )}
    </div>
  );
}

function SOPRunner({ sop, onBack, showToast }) {
  const [completed, setCompleted] = useState({});
  const [photos, setPhotos] = useState({});
  const [activeStep, setActiveStep] = useState(0);
  const [started, setStarted] = useState(false);

  const progress = Math.round(Object.keys(completed).length / sop.steps.length * 100);
  const toggleStep = (id) => setCompleted(c => { const n={...c}; if(n[id]) delete n[id]; else n[id]={at:new Date().toISOString()}; return n; });
  const addPhoto = (stepId) => { setPhotos(p => ({...p,[stepId]:[...(p[stepId]||[]),{id:Date.now(),name:'IMG_'+Math.floor(Math.random()*9000+1000)+'.jpg'}]})); showToast('Photo uploaded'); };

  const finish = () => {
    const allDone = Object.keys(completed).length === sop.steps.length;
    const photosOk = sop.steps.filter(s=>s.requiresPhoto).every(s=>photos[s.id]?.length);
    if (!allDone) return showToast('Some steps are incomplete');
    if (!photosOk) return showToast('Photo checkpoints missing');
    showToast('Execution logged');
    setTimeout(onBack, 700);
  };

  if (!started) {
    return (
      <div className="max-w-[720px] mx-auto px-6 lg:px-10 py-8 lg:py-12 animate-fade-up">
        <BreadcrumbBack onClick={onBack} label="All SOPs"/>
        <div className="card rounded-2xl p-8">
          <div className="tracked text-muted2 mb-3">{sop.linkedClass}</div>
          <h1 className="display-serif text-[32px] lg:text-[44px] text-ink mb-5 leading-[1.04]" style={{fontWeight:500}}>{sop.title}</h1>
          <div className="flex items-center gap-3 text-[13px] text-muted mb-8 flex-wrap">
            <span className="inline-flex items-center gap-1.5"><I.clock className="w-3.5 h-3.5"/>{sop.duration}</span>
            <span className="text-muted2">·</span>
            <span>{sop.steps.length} steps</span>
            <span className="text-muted2">·</span>
            <span>{sop.steps.filter(s=>s.requiresPhoto).length} photo checkpoints</span>
          </div>

          <div className="tracked text-muted2 mb-3">Materials to prepare</div>
          <div className="grid sm:grid-cols-2 gap-2 mb-8">
            {sop.materials.map(m => (
              <div key={m} className="flex items-center gap-2.5 p-2.5 rounded-lg card-sunken text-[13px] text-ink">
                <div className="check-box checked"><I.check className="w-3 h-3 text-canvas"/></div>
                <span>{m}</span>
              </div>
            ))}
          </div>

          <button onClick={()=>setStarted(true)} className="btn-primary w-full py-3 rounded-full text-[13px] flex items-center justify-center gap-2">
            <I.play className="w-3 h-3"/> Start execution
          </button>
        </div>
      </div>
    );
  }

  const current = sop.steps[activeStep];
  const stepPhotos = photos[current.id] || [];

  return (
    <div className="max-w-[900px] mx-auto px-6 lg:px-10 py-8 lg:py-12 animate-fade-up">
      <div className="flex items-center justify-between mb-6">
        <button onClick={()=>setStarted(false)} className="flex items-center gap-1.5 text-[13px] text-muted hover:text-ink transition"><I.chevL className="w-4 h-4"/><span>Exit</span></button>
        <div className="text-[12px] text-muted tabular-nums">{Object.keys(completed).length} / {sop.steps.length} complete</div>
      </div>

      <div className="mb-8">
        <ProgressBar value={progress} height={4}/>
      </div>

      <div className="tracked text-muted mb-3">{sop.title}</div>

      <div className="card rounded-2xl p-6 lg:p-8 mb-6">
        <div className="flex items-start gap-4 mb-6">
          <div className="display-serif text-[30px] text-ochre tabular-nums shrink-0" style={{fontWeight:500}}>{String(activeStep+1).padStart(2,'0')}</div>
          <div className="flex-1">
            <h2 className="display-serif text-[28px] lg:text-[32px] text-ink mb-2 leading-[1.1]" style={{fontWeight:500}}>{current.title}</h2>
            <div className="text-[13px] text-muted">{current.time}</div>
          </div>
          <button onClick={()=>toggleStep(current.id)} className={`check-box ${completed[current.id] ? 'checked' : ''} w-8 h-8`}>
            <I.check className="w-4 h-4 text-canvas"/>
          </button>
        </div>

        <p className="text-[15.5px] text-muted leading-relaxed mb-6">{current.desc}</p>

        {current.requiresPhoto && (
          <div className="card-sunken rounded-xl p-5">
            <div className="flex items-center gap-2 mb-4">
              <I.camera className="w-4 h-4 text-ink"/>
              <div className="text-[13px] font-medium text-ink">Photo checkpoint</div>
              <Pill tone="ochre">Required</Pill>
            </div>
            <p className="text-[13px] text-muted mb-4">{current.photoPrompt}</p>
            {stepPhotos.length > 0 && (
              <div className="grid grid-cols-3 gap-2 mb-3">
                {stepPhotos.map(p => (
                  <div key={p.id} className="thumb aspect-square rounded-lg flex items-center justify-center relative">
                    <I.image className="w-5 h-5 text-white relative z-10"/>
                  </div>
                ))}
              </div>
            )}
            <button onClick={()=>addPhoto(current.id)} className="btn-ghost w-full py-2 rounded-xl text-[12.5px] flex items-center justify-center gap-2">
              <I.camera className="w-3.5 h-3.5"/> Upload photo
            </button>
          </div>
        )}
      </div>

      <div className="flex items-center gap-3">
        <button onClick={()=>setActiveStep(Math.max(0,activeStep-1))} disabled={activeStep===0} className="btn-ghost px-5 py-2.5 rounded-full text-[13px] disabled:opacity-30">Previous</button>
        {activeStep < sop.steps.length - 1 ? (
          <button onClick={()=>setActiveStep(activeStep+1)} className="btn-primary flex-1 py-2.5 rounded-full text-[13px]">Next step →</button>
        ) : (
          <button onClick={finish} className="btn-primary flex-1 py-2.5 rounded-full text-[13px] inline-flex items-center justify-center gap-2"><I.check className="w-3.5 h-3.5"/> Finish execution</button>
        )}
      </div>

      <div className="mt-10">
        <div className="tracked text-muted mb-3">All steps</div>
        <div className="space-y-1.5">
          {sop.steps.map((s, i) => (

function ChildReport({ child, onBack, showToast }) {
  const [showAdd, setShowAdd] = useState(false);
  const [note, setNote] = useState('');
  const [selectedAreas, setSelectedAreas] = useState([]);
  const observations = MOCK_OBSERVATIONS.filter(o => o.childId === child.id);

  const toggleArea = (id) => setSelectedAreas(a => a.includes(id) ? a.filter(x=>x!==id) : [...a, id]);
  const submitObs = () => {
    if (!note.trim() || selectedAreas.length === 0) return;
    showToast('Observation logged');
    setNote(''); setSelectedAreas([]); setShowAdd(false);
  };

  return (
    <div className="max-w-[1000px] mx-auto px-6 lg:px-10 py-10 lg:py-14 animate-fade-up">
      <BreadcrumbBack onClick={onBack} label="All children"/>

      <div className="card rounded-2xl p-6 lg:p-8 mb-6">
        <div className="flex items-center gap-5 mb-6">
          <div className="w-16 h-16 rounded-full bg-surface hairline border flex items-center justify-center">
            <span className="display-serif text-[24px] text-ink" style={{fontWeight:500}}>{child.name.split(' ').map(n=>n[0]).join('')}</span>
          </div>
          <div className="flex-1">
            <div className="tracked text-muted2 mb-1">Child</div>
            <h1 className="display-serif text-[36px] lg:text-[44px] text-ink leading-[1.02]" style={{fontWeight:500}}>{child.name}</h1>
            <div className="text-[13px] text-muted mt-1">Age {child.age} · {observations.length} observations on file</div>
          </div>
          <button onClick={()=>setShowAdd(true)} className="btn-primary px-4 py-2.5 rounded-full text-[13px] inline-flex items-center gap-2">
            <I.plus className="w-3.5 h-3.5"/> New observation
          </button>
        </div>
      </div>

      {showAdd && (
        <div className="card rounded-2xl p-6 mb-6 animate-fade-up">
          <div className="flex items-center justify-between mb-5">
            <h3 className="display-serif text-[20px] text-ink" style={{fontWeight:500}}>New observation</h3>
            <button onClick={()=>setShowAdd(false)}><I.x className="w-4 h-4 text-muted"/></button>
          </div>
          <textarea value={note} onChange={e=>setNote(e.target.value)} rows="4" placeholder="What did you observe?" className="input w-full p-3 rounded-xl text-[14px] resize-none mb-4"/>
          <div className="tracked text-muted2 mb-3">EYFS areas (select one or more)</div>
          <div className="flex flex-wrap gap-2 mb-5">
            {EYFS_AREAS.map(a => (
              <button key={a.id} onClick={()=>toggleArea(a.id)} className={`px-3 py-1.5 rounded-full text-[12px] font-medium transition ${selectedAreas.includes(a.id) ? 'bg-ink text-canvas' : 'bg-surface text-muted hover:text-ink border hairline'}`}>
                {a.name}
              </button>
            ))}
          </div>
          <div className="flex gap-2">
            <button onClick={submitObs} disabled={!note.trim() || !selectedAreas.length} className="btn-primary px-5 py-2 rounded-full text-[13px] disabled:opacity-40">Save observation</button>
            <button onClick={()=>setShowAdd(false)} className="btn-ghost px-5 py-2 rounded-full text-[13px]">Cancel</button>
          </div>
        </div>
      )}

      <div className="tracked text-muted mb-4 detail-line-ochre">Recent observations</div>
      <div className="space-y-4 stagger">
        {observations.map(o => (
          <div key={o.id} className="card rounded-2xl p-6">
            <div className="flex items-center justify-between mb-3">
              <div className="flex flex-wrap gap-1.5">
                {o.areas.map(aid => {
                  const area = EYFS_AREAS.find(a => a.id === aid);
                  return <Pill key={aid} tone="neutral">{area?.short}</Pill>;
                })}
              </div>
              <div className="text-[11px] text-muted tabular-nums">{o.date}</div>
            </div>
            <p className="text-[14.5px] text-ink leading-relaxed">{o.note}</p>
          </div>
        ))}
      </div>
    </div>
  );
}

        submission.auditScore < 70 ? 'border-t-coral' : submission.auditScore < 85 ? '' : ''
      }`} style={submission.auditScore < 70 ? {borderTopColor:'var(--coral)'} : {}}>
        <div className="flex items-center gap-5 flex-wrap">
          <div className={`w-14 h-14 rounded-full flex items-center justify-center shrink-0 ${
            submission.auditScore >= 85 ? 'bg-mint/15 text-mint' :
            submission.auditScore >= 70 ? 'bg-ochre/15 text-ochre' :
                                          'bg-coral/15 text-coral'

            <span className="display-sans text-[22px] tabular-nums font-medium">{submission.auditScore}</span>
          </div>
          <div className="flex-1 min-w-0">
            <div className="tracked text-muted2 mb-1">Audit signals · this period</div>
            <div className="display-serif text-[20px] text-ink leading-tight" style={{fontWeight:500}}>{auditLabel} · audit score {submission.auditScore}/100</div>
          </div>
          <div className="grid grid-cols-3 gap-4 lg:gap-6 text-[12px] shrink-0">
            <div className="text-right">
              <div className="text-muted">Confirmed</div>
              <div className={`font-medium tabular-nums ${submission.confirmedPayments / (submission.confirmedPayments + submission.unconfirmedPayments) >= 0.85 ? 'text-success' : 'text-ochre'}`}>
                {Math.round(submission.confirmedPayments / (submission.confirmedPayments + submission.unconfirmedPayments) * 100)}%
              </div>
            </div>
            <div className="text-right">
              <div className="text-muted">Attendance</div>
              <div className="font-medium tabular-nums text-ink">{submission.attendanceLogged}</div>
            </div>
            <div className="text-right">
              <div className="text-muted">Flags</div>
              <div className={`font-medium tabular-nums ${submission.anomalyFlags === 0 ? 'text-success' : 'text-coral'}`}>{submission.anomalyFlags}</div>
            </div>
          </div>
        </div>
      </div>

      {/* Revenue breakdown */}
      <div className="card rounded-2xl p-6 lg:p-8 mb-8">
        <div className="tracked text-muted2 mb-4">Revenue breakdown · franchisee-reported</div>
        <div className="space-y-3">
          {breakdown.map((row, i) => (
            <div key={i} className="flex items-center gap-4">
              <div className="w-40 text-[13.5px] text-ink font-medium shrink-0">{row.category}</div>
              <div className="flex-1 h-7 bg-surface rounded-md overflow-hidden hairline border">
                <div className="h-full rounded-md transition-all" style={{ width:`${(row.gross / submission.grossRevenue) * 100}%`, background:'var(--ink)' }}/>
              </div>
              <div className="text-right shrink-0 tabular-nums">
                <div className="text-[13.5px] font-medium text-ink">RM {row.gross.toLocaleString()}</div>
                <div className="text-[10.5px] text-muted">{row.count} transactions</div>
              </div>
            </div>
          ))}
        </div>
      </div>

      {/* Cross-checks */}
      <div className="grid md:grid-cols-3 gap-4 mb-8">
        <CrossCheckCard label="Parent confirmations" value={`${submission.confirmedPayments}/${submission.confirmedPayments + submission.unconfirmedPayments}`} note={`${Math.round(submission.confirmedPayments/(submission.confirmedPayments+submission.unconfirmedPayments)*100)}% confirmed receipt of payment`} status={submission.confirmedPayments / (submission.confirmedPayments + submission.unconfirmedPayments) >= 0.85 ? 'green' : 'yellow'}/>
        <CrossCheckCard label="Attendance vs enrolment" value={`${submission.attendanceLogged}`} note="class sessions logged with attendance" status="green"/>
        <CrossCheckCard label="Anomaly flags" value={String(submission.anomalyFlags)} note={submission.anomalyFlags === 0 ? 'No discrepancies detected' : 'Review flags before approving'} status={submission.anomalyFlags === 0 ? 'green' : 'red'}/>
      </div>

      {/* Action panel */}
      <div className="card-accent rounded-2xl p-6 lg:p-8">
        <div className="flex items-start gap-4 mb-5">
          <div className="w-10 h-10 rounded-xl bg-ochre/15 border border-ochre/30 flex items-center justify-center shrink-0 text-ochre">
            <I.shield className="w-5 h-5"/>
          </div>
          <div className="flex-1">
            <h3 className="display-serif text-[22px] text-ink mb-1" style={{fontWeight:500}}>HQ decision</h3>
            <p className="text-[13px] text-muted">
              Approve to clear the royalty for collection via bank transfer. Query if you need clarification — the franchisee will receive a notification with your comments and can resubmit.
            </p>
          </div>
        </div>

        <div className="pt-5 hairline-t">
          <label className="tracked text-muted2 block mb-2">Comments to franchisee (optional on approve, required on query)</label>
          <textarea value={comments} onChange={e=>setComments(e.target.value)} rows="3" placeholder="Add any notes the franchisee should see…" className="input w-full p-3 rounded-xl text-[13.5px] resize-none mb-5"/>

          <div className="flex flex-wrap gap-3">
            <button onClick={()=>submit('approve')} disabled={!!decision} className="btn-primary px-6 py-3 rounded-full text-[13px] inline-flex items-center gap-2 disabled:opacity-40">
              <I.check className="w-3.5 h-3.5"/> Approve · RM {submission.royaltyAmount.toLocaleString()}
            </button>
            <button onClick={()=>submit('query')} disabled={!!decision || !comments.trim()} className="btn-ghost px-6 py-3 rounded-full text-[13px] inline-flex items-center gap-2 disabled:opacity-40">
              <I.send className="w-3.5 h-3.5"/> Query
            </button>
            <button onClick={()=>showToast('Statement saved as pending')} className="btn-ghost px-6 py-3 rounded-full text-[13px]">Hold for review</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function CrossCheckCard({ label, value, note, status }) {
  return (
    <div className="card rounded-2xl p-5">
      <div className="flex items-center gap-2 mb-3">
        <span className={`indicator-dot indicator-${status}`}></span>

      </div>
      <div className="display-sans text-[24px] text-ink tabular-nums">{value}</div>
      <div className="text-[11px] text-muted mt-1">{note}</div>
    </div>
  );
}

function HQAcademyHome({ onOpen, showToast }) {

                    <div className="flex items-baseline justify-between gap-3 mb-0.5 flex-wrap">
                      <div className="text-[13px] font-medium text-ink">{sig.label}</div>
                      <div className="flex items-center gap-2 tabular-nums text-[12px]">
                        <span className="text-ink font-medium">{sig.value}</span>
                        <span className="text-muted2">peer {sig.peer}</span>
                      </div>
                    </div>
                    <div className="text-[11.5px] text-muted">{sig.detail}</div>
                  </div>
                </div>
              ))}
            </div>
          ) : <div className="text-[13px] text-muted">No audit data yet.</div>}
        </div>

        <div className="space-y-4">
          {royalty && (
            <div className="card rounded-2xl p-5">
              <div className="tracked text-muted2 mb-1">April royalty</div>
              <div className="display-serif text-[26px] text-ink tabular-nums" style={{fontWeight:500}}>RM {royalty.royaltyAmount.toLocaleString()}</div>
              <div className="text-[11.5px] text-muted mt-1">
                {royalty.status === 'submitted' && 'Awaiting review'}
                {royalty.status === 'draft' && `Drafting · due in ${royalty.daysUntilDue}d`}
                {royalty.status === 'approved' && 'Approved'}
              </div>
            </div>
          )}
          <div className="card rounded-2xl p-5">
            <div className="tracked text-muted2 mb-2">Open alerts</div>
            {alerts.length > 0 ? (
              <div className="space-y-2">
                {alerts.map(a => (
                  <div key={a.id} className="flex items-start gap-2">
                    <span className={`indicator-dot indicator-${a.severity === 'high' ? 'red' : a.severity === 'medium' ? 'yellow' : 'green'} mt-1`}></span>
                    <div className="text-[12px] text-ink leading-tight">{a.title}</div>
                  </div>
                ))}
              </div>
            ) : <div className="text-[13px] text-success inline-flex items-center gap-1.5"><I.check className="w-3.5 h-3.5"/> All clear</div>}
          </div>
        </div>
      </div>
    </div>
  );
}

// ═══════ HQ ANNOUNCEMENTS ═══════
function HQAnnouncementsPage({ showToast }) {
  const [editorOpen, setEditorOpen] = useState(false);
  const [editingAnnouncement, setEditingAnnouncement] = useState(null);
  const [announcements, setAnnouncements] = useState(ANNOUNCEMENTS);

  const openNew = () => { setEditingAnnouncement(null); setEditorOpen(true); };
  const openEdit = (a) => { setEditingAnnouncement(a); setEditorOpen(true); };
  const saveAnnouncement = (data) => {
    if (editingAnnouncement) {
      setAnnouncements(announcements.map(a => a.id === data.id ? { ...a, ...data } : a));
    } else {
      setAnnouncements([data, ...announcements]);
    }
  };
  const archiveAnnouncement = (id) => {
    setAnnouncements(announcements.filter(a => a.id !== id));
    showToast('Announcement archived');
  };
  const togglePin = (id) => {
    setAnnouncements(announcements.map(a => a.id === id ? { ...a, pinned: !a.pinned } : a));
    const a = announcements.find(x => x.id === id);
    showToast(a?.pinned ? 'Unpinned' : 'Pinned to top');
  };

  return (
    <div className="max-w-[1280px] mx-auto px-6 lg:px-10 py-10 lg:py-14 animate-fade-up">
      <PageHeader
        eyebrow="Content · Announcements"
        title="What's New publisher"
        subtitle="Posts here appear on every franchisee's dashboard. Pin important items to keep them at the top."
        right={<button onClick={openNew} className="btn-primary px-4 py-2.5 rounded-full text-[13px] inline-flex items-center gap-2"><I.plus className="w-3.5 h-3.5"/> New announcement</button>}
      />

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 lg:gap-4 mb-8">
        <StatCard value={String(announcements.length)} label="Total published"/>
        <StatCard value={String(announcements.filter(a=>a.pinned).length)} label="Pinned"/>
        <StatCard value="4/4" label="Stores receiving"/>
        <StatCard value="89%" label="Average read rate" trend="+5%" trendUp/>
      </div>

      {announcements.length === 0 ? (
        <div className="card rounded-2xl p-12 text-center">
          <div className="w-14 h-14 mx-auto mb-4 rounded-2xl bg-surface hairline border flex items-center justify-center text-muted2">
            <I.bell className="w-6 h-6"/>
          </div>
          <div className="display-serif text-[20px] text-ink mb-2" style={{fontWeight:500}}>No announcements yet</div>
          <p className="text-[13px] text-muted max-w-sm mx-auto mb-5">Publish your first announcement to keep franchisees informed about what's new.</p>
          <button onClick={openNew} className="btn-primary px-5 py-2.5 rounded-full text-[13px] inline-flex items-center gap-2"><I.plus className="w-3.5 h-3.5"/> New announcement</button>
        </div>
      ) : (
        <div className="space-y-3 stagger">
          {announcements.map(a => (
            <div key={a.id} className={`${a.pinned ? 'card-accent' : 'card'} rounded-2xl p-5 lg:p-6 flex items-start gap-5`}>
              <div className="flex-1 min-w-0">
                <div className="flex items-center gap-2 mb-2 flex-wrap">
                  {a.pinned && <Pill tone="ochre">Pinned</Pill>}
                  <Pill tone="neutral">{a.category}</Pill>
                  <span className="text-[11px] text-muted tabular-nums">{a.date}</span>
                </div>
                <div className="display-serif text-[20px] text-ink leading-tight mb-1.5" style={{fontWeight:500}}>{a.title}</div>
                <p className="text-[13.5px] text-muted leading-relaxed mb-3">{a.excerpt}</p>
                <div className="flex items-center gap-3 text-[11.5px] text-muted2">
                  <span>{a.author}</span>
                  <span className="text-muted2">·</span>
                  <span>Read by 4/4 stores</span>
                  {a.actionLabel && <>
                    <span className="text-muted2">·</span>
                    <span className="text-ochre">CTA: {a.actionLabel}</span>
                  </>}
                </div>
              </div>
              <div className="flex gap-1 shrink-0">
                <button onClick={()=>openEdit(a)} className="p-2 hover:bg-surface rounded-lg transition" title="Edit"><I.edit className="w-4 h-4 text-muted2"/></button>
                <button onClick={()=>togglePin(a.id)} className="p-2 hover:bg-surface rounded-lg transition" title={a.pinned ? 'Unpin' : 'Pin'}><I.starF className="w-4 h-4" style={{color: a.pinned ? 'var(--ochre)' : 'var(--muted2)'}}/></button>
                <button onClick={()=>archiveAnnouncement(a.id)} className="p-2 hover:bg-surface rounded-lg transition" title="Archive"><I.x className="w-4 h-4 text-muted2"/></button>
              </div>
            </div>
          ))}
        </div>
      )}

      <AnnouncementEditor
        open={editorOpen}
        announcement={editingAnnouncement}
        onClose={()=>setEditorOpen(false)}
        onSave={saveAnnouncement}
        showToast={showToast}
      />
    </div>
  );
}

// ═══════ HQ SOP LIBRARY ═══════
function HQSopLibrary({ showToast }) {
  const iconMap = { teaching:I.book, sales:I.cake, ops:I.cog };
  const [editorOpen, setEditorOpen] = useState(false);
  const [editingSop, setEditingSop] = useState(null);
  const [sops, setSops] = useState(SOP_TEMPLATES);

  const openNew = () => { setEditingSop(null); setEditorOpen(true); };
  const openEdit = (s) => { setEditingSop(s); setEditorOpen(true); };
  const saveSop = (data) => {
    if (editingSop) {
      setSops(sops.map(s => s.id === data.id ? data : s));
    } else {
      setSops([...sops, data]);
    }
  };

  return (
    <div className="max-w-[1280px] mx-auto px-6 lg:px-10 py-10 lg:py-14 animate-fade-up">
      <PageHeader
        eyebrow="Content · SOP library"
        title="SOP library"
        subtitle="Master copies of every standard operating procedure. Edit here, all franchisees see updates instantly with version history."
        right={<button onClick={openNew} className="btn-primary px-4 py-2.5 rounded-full text-[13px] inline-flex items-center gap-2"><I.plus className="w-3.5 h-3.5"/> New SOP</button>}
      />

      <div className="grid grid-cols-2 lg:grid-cols-3 gap-3 lg:gap-4 mb-8">
        {SOP_CATEGORIES.map(cat => {
          const Icon = iconMap[cat.id];
          const count = sops.filter(s => s.category === cat.id).length;
          return (
            <div key={cat.id} className="card rounded-2xl p-5 flex items-center gap-4">
              <div className="w-12 h-12 rounded-xl bg-surface hairline border flex items-center justify-center text-ink shrink-0">
                <Icon className="w-5 h-5"/>
              </div>
              <div>
                <div className="display-serif text-[18px] text-ink" style={{fontWeight:500}}>{cat.name}</div>
                <div className="text-[11.5px] text-muted tabular-nums">{count} active SOPs</div>
              </div>
            </div>
          );
        })}
      </div>

      <div className="card rounded-2xl overflow-hidden">
        <div className="p-5 lg:p-6 hairline-b flex items-center justify-between">
          <h3 className="display-serif text-[20px] text-ink" style={{fontWeight:500}}>All SOPs</h3>
          <span className="text-[12px] text-muted tabular-nums">{sops.length} total</span>
        </div>
        <div>
          {sops.map((s, i) => {
            const Icon = iconMap[s.category];
            return (
              <div key={s.id} className={`p-5 flex items-center gap-5 hover:bg-surface/50 transition ${i !== sops.length-1 ? 'hairline-b' : ''}`}>
                <div className="w-10 h-10 rounded-xl bg-surface hairline border flex items-center justify-center shrink-0 text-ink">
                  <Icon className="w-[17px] h-[17px]"/>
                </div>
                <div className="flex-1 min-w-0">
                  <div className="flex items-center gap-2 mb-0.5 flex-wrap">
                    <Pill tone="neutral">{SOP_CATEGORIES.find(c=>c.id===s.category)?.name}</Pill>
                    <span className="text-[11px] text-muted">{s.duration}</span>
                  </div>
                  <div className="text-[14px] font-medium text-ink truncate">{s.title}</div>
                  <div className="text-[11.5px] text-muted tabular-nums">{s.steps.length} steps · {s.steps.filter(st=>st.requiresPhoto).length} photo checkpoints · live to 4 stores</div>
                </div>
                <div className="flex gap-1 shrink-0">
                  <button onClick={()=>openEdit(s)} className="p-2 hover:bg-surface rounded-lg transition" title="Edit"><I.edit className="w-4 h-4 text-muted2"/></button>
                  <button onClick={()=>openEdit(s)} className="p-2 hover:bg-surface rounded-lg transition" title="Open"><I.chevR className="w-4 h-4 text-muted2"/></button>
                </div>
              </div>
            );
          })}
        </div>
      </div>

      <SopEditor
        open={editorOpen}
        sop={editingSop}
        onClose={()=>setEditorOpen(false)}
        onSave={saveSop}
        showToast={showToast}
      />
    </div>
  );
}
